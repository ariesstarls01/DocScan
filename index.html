<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>DocScan</title>

<!-- OpenCV -->
<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

header {
    text-align: center;
    padding: 28px 10px 5px;
    font-size: 30px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-size: 16px;
    margin: 8px 0 22px;
}

.buttons {
    display: flex;
    gap: 10px;
    padding: 0 14px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 16px 5px;
    font-size: 17px;
    font-weight: 700;
    background: #fff;
    color: #111;
}

button.dark {
    background: #333;
    color: #fff;
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .4;
}

input {
    display: none;
}

#status {
    text-align: center;
    color: #aaa;
    font-size: 15px;
    min-height: 25px;
    margin: 20px 15px 12px;
}

#pages {
    padding: 0 12px 40px;
}

.page {
    background: #222;
    border-radius: 15px;
    padding: 10px;
    margin-bottom: 16px;
}

.page img {
    display: block;
    width: 100%;
    border-radius: 9px;
}

.page-title {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-top: 8px;
}

canvas {
    display: none;
}

</style>
</head>


<body>

<header>📄 DocScan</header>

<div class="subtitle">
Tự động nhận diện mép giấy
</div>


<div class="buttons">

    <button id="cameraButton">
        📷 Chụp
    </button>

    <button id="galleryButton" class="dark">
        🖼️ Thư viện
    </button>

    <button id="pdfButton" class="dark">
        📑 PDF
    </button>

</div>


<input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
>

<input
    id="galleryInput"
    type="file"
    accept="image/*"
    multiple
>


<div id="status">
⏳ Đang tải bộ nhận diện...
</div>


<div id="pages"></div>

<canvas id="canvas"></canvas>


<script>

/* =====================================================
   BIẾN
===================================================== */

let cvReady = false;

let pages = [];

const cameraButton =
    document.getElementById("cameraButton");

const galleryButton =
    document.getElementById("galleryButton");

const pdfButton =
    document.getElementById("pdfButton");

const cameraInput =
    document.getElementById("cameraInput");

const galleryInput =
    document.getElementById("galleryInput");

const statusBox =
    document.getElementById("status");

const pagesBox =
    document.getElementById("pages");

const canvas =
    document.getElementById("canvas");


/* =====================================================
   KHÓA NÚT KHI OPENCV CHƯA SẴN SÀNG
===================================================== */

cameraButton.disabled = true;
galleryButton.disabled = true;


/* =====================================================
   KHỞI ĐỘNG OPENCV
===================================================== */

function startOpenCV() {

    statusBox.innerText =
        "⏳ Đang tải bộ nhận diện...";

    let count = 0;

    const timer =
        setInterval(function() {

            count++;

            try {

                if (
                    typeof cv !== "undefined" &&
                    cv &&
                    typeof cv.Mat !== "undefined"
                ) {

                    clearInterval(timer);

                    cvReady = true;

                    cameraButton.disabled = false;
                    galleryButton.disabled = false;

                    statusBox.innerText =
                        "✅ Sẵn sàng — hãy chụp hoặc chọn ảnh";

                    console.log(
                        "DocScan: OpenCV READY"
                    );

                }

            } catch (e) {

                console.log(
                    "OpenCV loading..."
                );

            }


            if (count >= 80) {

                clearInterval(timer);

                statusBox.innerText =
                    "❌ Không tải được bộ nhận diện.";

                console.error(
                    "DocScan: OpenCV timeout"
                );

            }

        }, 500);

}


startOpenCV();


/* =====================================================
   NÚT
===================================================== */

cameraButton.onclick =
    function() {

        if (!cvReady) {

            alert(
                "Bộ nhận diện chưa tải xong."
            );

            return;
        }

        cameraInput.value = "";

        cameraInput.click();

    };


galleryButton.onclick =
    function() {

        if (!cvReady) {

            alert(
                "Bộ nhận diện chưa tải xong."
            );

            return;
        }

        galleryInput.value = "";

        galleryInput.click();

    };


pdfButton.onclick =
    function() {

        makePDF();

    };


/* =====================================================
   FILE INPUT
===================================================== */

cameraInput.addEventListener(
    "change",
    handleFiles
);

galleryInput.addEventListener(
    "change",
    handleFiles
);


/* =====================================================
   XỬ LÝ ẢNH
===================================================== */

async function handleFiles(event) {

    const files =
        Array.from(
            event.target.files || []
        );

    if (!files.length) {
        return;
    }

    if (!cvReady) {

        alert(
            "Bộ nhận diện chưa tải xong."
        );

        return;
    }


    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        statusBox.innerText =
            `🔍 Đang tự căn mép trang ${i + 1}/${files.length}...`;


        try {

            const image =
                await loadImage(files[i]);


            const result =
                scanDocument(image);


            pages.push(result);


            renderPages();


        } catch (error) {

            console.error(error);

            alert(
                "Không xử lý được ảnh này."
            );

        }

    }


    statusBox.innerText =
        `✅ Đã quét ${files.length} trang`;

}


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(file) {

    return new Promise(
        function(resolve, reject) {

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();


            img.onload =
                function() {

                    URL.revokeObjectURL(url);

                    resolve(img);

                };


            img.onerror =
                function() {

                    URL.revokeObjectURL(url);

                    reject(
                        new Error(
                            "Không đọc được ảnh"
                        )
                    );

                };


            img.src = url;

        }
    );

}


/* =====================================================
   SCAN
===================================================== */

function scanDocument(image) {

    /*
       Giảm kích thước để iPhone xử lý nhanh.
    */

    const MAX =
        2200;


    const originalWidth =
        image.naturalWidth;


    const originalHeight =
        image.naturalHeight;


    const scale =
        Math.min(
            1,
            MAX /
            Math.max(
                originalWidth,
                originalHeight
            )
        );


    const width =
        Math.round(
            originalWidth * scale
        );


    const height =
        Math.round(
            originalHeight * scale
        );


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const src =
        cv.imread(canvas);


    let corners = null;


    try {

        corners =
            findPaper(src);

    } catch (error) {

        console.error(
            "Detection error:",
            error
        );

    }


    let result;


    if (corners) {

        statusBox.innerText =
            "✂️ Đã nhận diện 4 mép — đang căn thẳng...";


        result =
            warpPaper(
                src,
                corners
            );

    } else {

        /*
           Không nhận diện được:
           giữ nguyên ảnh.
        */

        statusBox.innerText =
            "⚠️ Không chắc mép giấy — giữ ảnh gốc";


        result =
            src.clone();

    }


    src.delete();


    return matToJPEG(result);

}


/* =====================================================
   TÌM TỜ GIẤY
===================================================== */

function findPaper(src) {

    const W =
        src.cols;

    const H =
        src.rows;

    const totalArea =
        W * H;


    /* -------------------------------------------------
       GRAYSCALE
    ------------------------------------------------- */

    const gray =
        new cv.Mat();


    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    /* -------------------------------------------------
       BLUR
    ------------------------------------------------- */

    const blur =
        new cv.Mat();


    cv.GaussianBlur(
        gray,
        blur,
        new cv.Size(5, 5),
        0
    );


    /* -------------------------------------------------
       CANNY
    ------------------------------------------------- */

    const edges =
        new cv.Mat();


    cv.Canny(
        blur,
        edges,
        25,
        90
    );


    /* -------------------------------------------------
       CLOSE MÉP
    ------------------------------------------------- */

    const kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(9, 9)
        );


    cv.morphologyEx(
        edges,
        edges,
        cv.MORPH_CLOSE,
        kernel
    );


    /* -------------------------------------------------
       CONTOURS
    ------------------------------------------------- */

    const contours =
        new cv.MatVector();

    const hierarchy =
        new cv.Mat();


    cv.findContours(
        edges,
        contours,
        hierarchy,
        cv.RETR_LIST,
        cv.CHAIN_APPROX_SIMPLE
    );


    let best =
        null;

    let bestScore =
        -Infinity;


    /* -------------------------------------------------
       DUYỆT CONTOUR
    ------------------------------------------------- */

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);


        const area =
            Math.abs(
                cv.contourArea(contour)
            );


        /*
           Tờ giấy phải đủ lớn.
        */

        if (
            area <
            totalArea * 0.08
        ) {

            contour.delete();

            continue;

        }


        const perimeter =
            cv.arcLength(
                contour,
                true
            );


        const approx =
            new cv.Mat();


        /*
           Thử approximation chặt hơn.
        */

        cv.approxPolyDP(
            contour,
            approx,
            0.015 * perimeter,
            true
        );


        if (
            approx.rows === 4 &&
            cv.isContourConvex(approx)
        ) {

            let pts = [];


            for (
                let j = 0;
                j < 4;
                j++
            ) {

                pts.push({

                    x:
                        approx.intAt(
                            j,
                            0
                        ),

                    y:
                        approx.intAt(
                            j,
                            1
                        )

                });

            }


            pts =
                orderPoints(pts);


            /*
               Kích thước 4 cạnh
            */

            const top =
                distance(
                    pts[0],
                    pts[1]
                );


            const bottom =
                distance(
                    pts[3],
                    pts[2]
                );


            const left =
                distance(
                    pts[0],
                    pts[3]
                );


            const right =
                distance(
                    pts[1],
                    pts[2]
                );


            const maxWidth =
                Math.max(
                    top,
                    bottom
                );


            const maxHeight =
                Math.max(
                    left,
                    right
                );


            /*
               Bỏ contour quá nhỏ.
            */

            if (
                maxWidth < W * 0.20 ||
                maxHeight < H * 0.20
            ) {

                approx.delete();
                contour.delete();

                continue;

            }


            /*
               Tỷ lệ khung.
               A4 dọc khoảng 1.41.
               Cho phép nhiều loại tài liệu.
            */

            const ratio =
                Math.max(
                    maxWidth,
                    maxHeight
                ) /
                Math.min(
                    maxWidth,
                    maxHeight
                );


            if (
                ratio > 5
            ) {

                approx.delete();
                contour.delete();

                continue;

            }


            /* -----------------------------------------
               CHẤT LƯỢNG GÓC
            ----------------------------------------- */

            let angleScore = 0;


            for (
                let j = 0;
                j < 4;
                j++
            ) {

                const a =
                    pts[
                        (j + 3) % 4
                    ];


                const b =
                    pts[j];


                const c =
                    pts[
                        (j + 1) % 4
                    ];


                const angle =
                    getAngle(
                        a,
                        b,
                        c
                    );


                const error =
                    Math.abs(
                        angle - 90
                    );


                angleScore +=
                    Math.max(
                        0,
                        1 -
                        error / 60
                    );

            }


            angleScore /=
                4;


            /* -----------------------------------------
               ĐỘ CÂN 4 CẠNH
            ----------------------------------------- */

            const widthError =
                Math.abs(
                    top - bottom
                ) /
                Math.max(
                    top,
                    bottom
                );


            const heightError =
                Math.abs(
                    left - right
                ) /
                Math.max(
                    left,
                    right
                );


            const rectangleScore =
                1 -
                Math.min(
                    1,
                    (
                        widthError +
                        heightError
                    ) / 2
                );


            /* -----------------------------------------
               DIỆN TÍCH
            ----------------------------------------- */

            const areaRatio =
                area /
                totalArea;


            const areaScore =
                Math.min(
                    1,
                    areaRatio / 0.70
                );


            /* -----------------------------------------
               TÂM HÌNH
            ----------------------------------------- */

            const cx =
                (
                    pts[0].x +
                    pts[1].x +
                    pts[2].x +
                    pts[3].x
                ) / 4;


            const cy =
                (
                    pts[0].y +
                    pts[1].y +
                    pts[2].y +
                    pts[3].y
                ) / 4;


            const centerDistance =
                Math.hypot(
                    cx - W / 2,
                    cy - H / 2
                ) /
                Math.hypot(
                    W / 2,
                    H / 2
                );


            const centerScore =
                1 -
                Math.min(
                    1,
                    centerDistance
                );


            /* -----------------------------------------
               SCORE TỔNG
            ----------------------------------------- */

            const score =

                areaScore * 55 +

                angleScore * 25 +

                rectangleScore * 15 +

                centerScore * 5;


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                best =
                    pts;

            }

        }


        approx.delete();
        contour.delete();

    }


    /* -------------------------------------------------
       CLEANUP
    ------------------------------------------------- */

    gray.delete();
    blur.delete();
    edges.delete();
    kernel.delete();
    contours.delete();
    hierarchy.delete();


    /*
       Ngưỡng tin cậy.
    */

    if (
        !best ||
        bestScore < 43
    ) {

        return null;

    }


    return best;

}


/* =====================================================
   SẮP XẾP 4 GÓC
===================================================== */

function orderPoints(points) {

    let tl = null;
    let tr = null;
    let br = null;
    let bl = null;


    let minSum =
        Infinity;

    let maxSum =
        -Infinity;

    let minDiff =
        Infinity;

    let maxDiff =
        -Infinity;


    for (
        const p of points
    ) {

        const sum =
            p.x + p.y;

        const diff =
            p.x - p.y;


        if (
            sum < minSum
        ) {

            minSum = sum;
            tl = p;

        }


        if (
            sum > maxSum
        ) {

            maxSum = sum;
            br = p;

        }


        if (
            diff > maxDiff
        ) {

            maxDiff = diff;
            tr = p;

        }


        if (
            diff < minDiff
        ) {

            minDiff = diff;
            bl = p;

        }

    }


    return [
        tl,
        tr,
        br,
        bl
    ];

}


/* =====================================================
   KHOẢNG CÁCH
===================================================== */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* =====================================================
   GÓC
===================================================== */

function getAngle(
    a,
    b,
    c
) {

    const abx =
        a.x - b.x;

    const aby =
        a.y - b.y;


    const cbx =
        c.x - b.x;

    const cby =
        c.y - b.y;


    const dot =
        abx * cbx +
        aby * cby;


    const m1 =
        Math.hypot(
            abx,
            aby
        );


    const m2 =
        Math.hypot(
            cbx,
            cby
        );


    if (
        m1 === 0 ||
        m2 === 0
    ) {

        return 0;

    }


    let cosine =
        dot /
        (
            m1 * m2
        );


    cosine =
        Math.max(
            -1,
            Math.min(
                1,
                cosine
            )
        );


    return (
        Math.acos(cosine) *
        180 /
        Math.PI
    );

}


/* =====================================================
   PERSPECTIVE TRANSFORM
===================================================== */

function warpPaper(
    src,
    p
) {

    const top =
        distance(
            p[0],
            p[1]
        );


    const bottom =
        distance(
            p[3],
            p[2]
        );


    const left =
        distance(
            p[0],
            p[3]
        );


    const right =
        distance(
            p[1],
            p[2]
        );


    let width =
        Math.round(
            Math.max(
                top,
                bottom
            )
        );


    let height =
        Math.round(
            Math.max(
                left,
                right
            )
        );


    /*
       Giữ tỷ lệ thực tế của giấy.
    */

    const maxOutput =
        2000;


    const scale =
        Math.min(
            1,
            maxOutput /
            Math.max(
                width,
                height
            )
        );


    width =
        Math.max(
            1,
            Math.round(
                width * scale
            )
        );


    height =
        Math.max(
            1,
            Math.round(
                height * scale
            )
        );


    const source =
        cv.matFromArray(
            4,
            1,
            cv.CV_32FC2,
            [

                p[0].x,
                p[0].y,

                p[1].x,
                p[1].y,

                p[2].x,
                p[2].y,

                p[3].x,
                p[3].y

            ]
        );


    const destination =
        cv.matFromArray(
            4,
            1,
            cv.CV_32FC2,
            [

                0,
                0,

                width,
                0,

                width,
                height,

                0,
                height

            ]
        );


    const matrix =
        cv.getPerspectiveTransform(
            source,
            destination
        );


    const corrected =
        new cv.Mat();


    cv.warpPerspective(
        src,
        corrected,
        matrix,
        new cv.Size(
            width,
            height
        ),
        cv.INTER_CUBIC,
        cv.BORDER_CONSTANT,
        new cv.Scalar(
            255,
            255,
            255,
            255
        )
    );


    /*
       Tăng nhẹ độ tương phản.
    */

    const enhanced =
        new cv.Mat();


    cv.convertScaleAbs(
        corrected,
        enhanced,
        1.06,
        3
    );


    source.delete();
    destination.delete();
    matrix.delete();
    corrected.delete();


    return enhanced;

}


/* =====================================================
   MAT → JPEG
===================================================== */

function matToJPEG(mat) {

    canvas.width =
        mat.cols;

    canvas.height =
        mat.rows;


    cv.imshow(
        canvas,
        mat
    );


    const result =
        canvas.toDataURL(
            "image/jpeg",
            0.94
        );


    mat.delete();


    return result;

}


/* =====================================================
   HIỂN THỊ
===================================================== */

function renderPages() {

    pagesBox.innerHTML = "";


    pages.forEach(
        function(src, index) {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "page";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                src;


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "page-title";


            title.innerText =
                `Trang ${index + 1}`;


            box.appendChild(
                img
            );


            box.appendChild(
                title
            );


            pagesBox.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   PDF
===================================================== */

async function makePDF() {

    if (
        pages.length === 0
    ) {

        alert(
            "Chưa có trang nào."
        );

        return;

    }


    statusBox.innerText =
        "📑 Đang tạo PDF...";


    const jsPDF =
        window.jspdf.jsPDF;


    const pdf =
        new jsPDF({

            orientation:
                "portrait",

            unit:
                "mm",

            format:
                "a4"

        });


    for (
        let i = 0;
        i < pages.length;
        i++
    ) {

        if (
            i > 0
        ) {

            pdf.addPage();

        }


        const image =
            await loadImageURL(
                pages[i]
            );


        const pageWidth =
            210;


        const pageHeight =
            297;


        const scale =
            Math.min(

                pageWidth /
                image.width,

                pageHeight /
                image.height

            );


        const w =
            image.width *
            scale;


        const h =
            image.height *
            scale;


        const x =
            (
                pageWidth -
                w
            ) / 2;


        const y =
            (
                pageHeight -
                h
            ) / 2;


        pdf.addImage(

            pages[i],

            "JPEG",

            x,
            y,

            w,
            h,

            undefined,

            "FAST"

        );

    }


    pdf.save(
        "DocScan.pdf"
    );


    statusBox.innerText =
        "✅ Đã tạo DocScan.pdf";

}


/* =====================================================
   LOAD DATA URL
===================================================== */

function loadImageURL(url) {

    return new Promise(
        function(resolve, reject) {

            const img =
                new Image();


            img.onload =
                function() {

                    resolve(img);

                };


            img.onerror =
                function() {

                    reject(
                        new Error(
                            "Không đọc được ảnh"
                        )
                    );

                };


            img.src =
                url;

        }
    );

}

</script>

</body>
</html>
