<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>DocScan</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  text-align:center;
  font-size:26px;
  font-weight:700;
  padding:24px 10px 8px;
}

#status{
  text-align:center;
  color:#aaa;
  font-size:15px;
  min-height:24px;
  padding:4px 10px 12px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  padding:0 12px 14px;
}

button{
  border:0;
  border-radius:15px;
  padding:17px 5px;
  background:#292929;
  color:#fff;
  font-size:17px;
  font-weight:600;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.45;
}

input{
  display:none;
}

#preview{
  width:calc(100% - 24px);
  margin:0 12px 12px;
  border-radius:14px;
  display:block;
}

#pages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:10px 12px;
}

.thumb{
  position:relative;
  overflow:hidden;
  border-radius:10px;
  background:#222;
}

.thumb img{
  width:100%;
  display:block;
}

.thumb span{
  position:absolute;
  right:5px;
  top:5px;
  background:#000b;
  padding:3px 7px;
  border-radius:10px;
  font-size:12px;
}

#clearBtn{
  width:calc(100% - 24px);
  margin:5px 12px 20px;
  background:#444;
}

</style>
</head>

<body>

<header>📄 DocScan</header>

<div id="status">Sẵn sàng</div>

<div class="buttons">
  <button onclick="camera.click()">📷 Chụp</button>
  <button onclick="gallery.click()">🖼️ Thư viện</button>
  <button onclick="makePDF()" id="pdfBtn">📄 PDF</button>
</div>

<input id="camera"
       type="file"
       accept="image/*"
       capture="environment">

<input id="gallery"
       type="file"
       accept="image/*">

<img id="preview">

<div id="pages"></div>

<button id="clearBtn"
        onclick="clearPages()"
        style="display:none">
  🗑️ Xóa tất cả
</button>


<script>

const camera=document.getElementById("camera");
const gallery=document.getElementById("gallery");
const preview=document.getElementById("preview");
const pagesBox=document.getElementById("pages");
const statusBox=document.getElementById("status");
const pdfBtn=document.getElementById("pdfBtn");
const clearBtn=document.getElementById("clearBtn");

let pages=[];

camera.onchange=handleFile;
gallery.onchange=handleFile;


/* =====================================================
   STATUS
===================================================== */

function status(text){
  statusBox.textContent=text;
}


/* =====================================================
   ĐỌC ẢNH
===================================================== */

function handleFile(e){

  const file=e.target.files[0];

  if(!file)return;

  status("⏳ Đang tìm 4 cạnh của tài liệu...");

  const reader=new FileReader();

  reader.onload=function(){

    const img=new Image();

    img.onload=function(){

      setTimeout(function(){

        try{

          const result=scanDocument(img);

          pages.push(result);

          preview.src=result;

          showPage(result);

          clearBtn.style.display="block";

          status("✅ Đã tự căn 4 góc");

        }catch(error){

          console.error(error);

          pages.push(img.src);

          preview.src=img.src;

          showPage(img.src);

          clearBtn.style.display="block";

          status("⚠️ Không nhận diện được — giữ ảnh gốc");
        }

      },40);
    };

    img.src=reader.result;
  };

  reader.readAsDataURL(file);

  e.target.value="";
}


/* =====================================================
   SCAN DOCUMENT
===================================================== */

function scanDocument(img){

  /*
    Giảm kích thước để xử lý nhanh trên iPhone.
  */

  const MAX=900;

  const scale=Math.min(
    1,
    MAX/Math.max(img.width,img.height)
  );

  const w=Math.round(img.width*scale);
  const h=Math.round(img.height*scale);

  const canvas=document.createElement("canvas");

  canvas.width=w;
  canvas.height=h;

  const ctx=canvas.getContext(
    "2d",
    {willReadFrequently:true}
  );

  ctx.drawImage(img,0,0,w,h);

  const image=ctx.getImageData(
    0,
    0,
    w,
    h
  );

  const gray=new Uint8Array(w*h);

  for(let i=0;i<w*h;i++){

    const p=i*4;

    gray[i]=Math.round(
      0.299*image.data[p]+
      0.587*image.data[p+1]+
      0.114*image.data[p+2]
    );
  }


  /*
    OTSU:
    tự tìm ngưỡng tách giấy sáng
    khỏi nền tối.
  */

  const threshold=otsuThreshold(gray);

  let mask=new Uint8Array(w*h);

  for(let i=0;i<gray.length;i++){

    mask[i]=gray[i]>=threshold?1:0;
  }


  /*
    Đóng các khe nhỏ do chữ,
    bóng và nhiễu.
  */

  mask=morphClose(mask,w,h);


  /*
    Tìm vùng sáng lớn nhất.
  */

  const component=largestComponent(
    mask,
    w,
    h
  );


  if(!component){

    return img.src;
  }


  /*
    Lấy các điểm BIÊN của tờ giấy.
  */

  const boundary=getBoundary(
    component,
    w,
    h
  );


  if(boundary.length<20){

    return img.src;
  }


  /*
    Tạo convex hull.
  */

  let hull=convexHull(boundary);


  if(hull.length<4){

    return img.src;
  }


  /*
    Rút gọn hull thành đúng 4 góc.
  */

  const corners=reduceToFourCorners(
    hull,
    w,
    h
  );


  if(!corners){

    return img.src;
  }


  /*
    Đổi tọa độ về ảnh gốc.
  */

  const originalCorners=corners.map(
    p=>[
      p[0]/scale,
      p[1]/scale
    ]
  );


  /*
    Kiểm tra diện tích.
  */

  const area=polygonArea(
    originalCorners
  );

  if(
    area<
    img.width*
    img.height*
    0.08
  ){

    return img.src;
  }


  /*
    Warp phối cảnh.
  */

  return perspectiveWarp(
    img,
    orderCorners(originalCorners)
  );
}


/* =====================================================
   OTSU
===================================================== */

function otsuThreshold(gray){

  const hist=new Uint32Array(256);

  for(let i=0;i<gray.length;i++){

    hist[gray[i]]++;
  }

  let total=gray.length;

  let sum=0;

  for(let i=0;i<256;i++){

    sum+=i*hist[i];
  }

  let sumBackground=0;
  let weightBackground=0;

  let bestVariance=-1;
  let bestThreshold=160;

  for(let t=0;t<256;t++){

    weightBackground+=hist[t];

    if(weightBackground===0)
      continue;

    const weightForeground=
      total-weightBackground;

    if(weightForeground===0)
      break;

    sumBackground+=
      t*hist[t];

    const meanBackground=
      sumBackground/
      weightBackground;

    const meanForeground=
      (sum-sumBackground)/
      weightForeground;

    const variance=
      weightBackground*
      weightForeground*
      Math.pow(
        meanBackground-
        meanForeground,
        2
      );

    if(variance>bestVariance){

      bestVariance=variance;
      bestThreshold=t;
    }
  }

  /*
    Không cho ngưỡng quá thấp.
    Giúp nền tối không bị nhận thành giấy.
  */

  return Math.max(
    110,
    Math.min(220,bestThreshold)
  );
}


/* =====================================================
   MORPH CLOSE
===================================================== */

function morphClose(mask,w,h){

  /*
    Dilation
  */

  let dilated=new Uint8Array(
    mask.length
  );

  for(let y=1;y<h-1;y++){

    for(let x=1;x<w-1;x++){

      let found=false;

      for(let dy=-1;dy<=1&&!found;dy++){

        for(let dx=-1;dx<=1;dx++){

          if(
            mask[
              (y+dy)*w+
              (x+dx)
            ]
          ){

            found=true;
            break;
          }
        }
      }

      if(found)
        dilated[y*w+x]=1;
    }
  }


  /*
    Erosion
  */

  let result=new Uint8Array(
    mask.length
  );

  for(let y=1;y<h-1;y++){

    for(let x=1;x<w-1;x++){

      let all=true;

      for(let dy=-1;dy<=1&&!all;dy++){

        for(let dx=-1;dx<=1;dx++){

          if(
            !dilated[
              (y+dy)*w+
              (x+dx)
            ]
          ){

            all=false;
            break;
          }
        }
      }

      if(all)
        result[y*w+x]=1;
    }
  }

  return result;
}


/* =====================================================
   LARGEST CONNECTED COMPONENT
===================================================== */

function largestComponent(mask,w,h){

  const visited=new Uint8Array(
    w*h
  );

  const queue=new Int32Array(
    w*h
  );

  let best=null;
  let bestSize=0;


  for(let y=0;y<h;y++){

    for(let x=0;x<w;x++){

      const start=y*w+x;

      if(
        !mask[start]||
        visited[start]
      ){
        continue;
      }


      let head=0;
      let tail=0;

      queue[tail++]=start;

      visited[start]=1;


      while(head<tail){

        const p=queue[head++];

        const px=p%w;
        const py=(p-px)/w;


        /*
          4 hướng + 4 góc
        */

        for(let dy=-1;dy<=1;dy++){

          for(let dx=-1;dx<=1;dx++){

            if(dx===0&&dy===0)
              continue;

            const nx=px+dx;
            const ny=py+dy;

            if(
              nx<0||
              nx>=w||
              ny<0||
              ny>=h
            ){
              continue;
            }

            const q=ny*w+nx;

            if(
              mask[q]&&
              !visited[q]
            ){

              visited[q]=1;

              queue[tail++]=q;
            }
          }
        }
      }


      /*
        Chỉ lấy vùng đủ lớn.
      */

      if(
        tail>bestSize &&
        tail>w*h*0.08
      ){

        bestSize=tail;

        best=
          new Int32Array(
            queue.slice(0,tail)
          );
      }
    }
  }

  return best;
}


/* =====================================================
   BOUNDARY
===================================================== */

function getBoundary(component,w,h){

  const inside=new Uint8Array(
    w*h
  );

  for(let i=0;i<component.length;i++){

    inside[component[i]]=1;
  }


  const boundary=[];


  for(let i=0;i<component.length;i++){

    const p=component[i];

    const x=p%w;
    const y=(p-x)/w;


    let edge=false;


    if(
      x<=0||
      x>=w-1||
      y<=0||
      y>=h-1
    ){

      edge=true;

    }else{

      if(
        !inside[p-1]||
        !inside[p+1]||
        !inside[p-w]||
        !inside[p+w]
      ){

        edge=true;
      }
    }


    if(edge){

      boundary.push([
        x,
        y
      ]);
    }
  }

  return boundary;
}


/* =====================================================
   CONVEX HULL
===================================================== */

function convexHull(points){

  /*
    Loại điểm trùng.
  */

  const map=new Map();

  for(const p of points){

    map.set(
      p[0]+","+p[1],
      p
    );
  }

  const pts=Array.from(
    map.values()
  );


  pts.sort(function(a,b){

    if(a[0]!==b[0])
      return a[0]-b[0];

    return a[1]-b[1];
  });


  if(pts.length<=3)
    return pts;


  function cross(o,a,b){

    return(
      (a[0]-o[0])*
      (b[1]-o[1])-
      (a[1]-o[1])*
      (b[0]-o[0])
    );
  }


  const lower=[];

  for(const p of pts){

    while(
      lower.length>=2&&
      cross(
        lower[lower.length-2],
        lower[lower.length-1],
        p
      )<=0
    ){

      lower.pop();
    }

    lower.push(p);
  }


  const upper=[];

  for(
    let i=pts.length-1;
    i>=0;
    i--
  ){

    const p=pts[i];

    while(
      upper.length>=2&&
      cross(
        upper[upper.length-2],
        upper[upper.length-1],
        p
      )<=0
    ){

      upper.pop();
    }

    upper.push(p);
  }


  lower.pop();
  upper.pop();

  return lower.concat(upper);
}


/* =====================================================
   REDUCE HULL -> 4 CORNERS
===================================================== */

function reduceToFourCorners(
  hull,
  w,
  h
){

  if(hull.length===4)
    return hull;


  let pts=hull.slice();


  /*
    Nếu hull có nhiều điểm,
    liên tục xóa điểm nằm gần
    đường thẳng giữa 2 hàng xóm.

    Các điểm giữa cạnh sẽ bị xóa trước.
    Các góc thật sẽ được giữ lại.
  */

  while(pts.length>4){

    let removeIndex=-1;
    let bestScore=Infinity;


    for(let i=0;i<pts.length;i++){

      const prev=
        pts[
          (i-1+pts.length)%
          pts.length
        ];

      const cur=pts[i];

      const next=
        pts[
          (i+1)%
          pts.length
        ];


      const score=
        pointLineDistance(
          cur,
          prev,
          next
        );


      if(score<bestScore){

        bestScore=score;
        removeIndex=i;
      }
    }


    if(removeIndex<0)
      break;


    pts.splice(
      removeIndex,
      1
    );
  }


  if(pts.length!==4)
    return null;


  /*
    Kiểm tra tứ giác.
  */

  const area=polygonArea(pts);

  if(
    area<
    w*h*.08
  ){

    return null;
  }


  return pts;
}


/* =====================================================
   POINT -> LINE DISTANCE
===================================================== */

function pointLineDistance(
  p,
  a,
  b
){

  const dx=b[0]-a[0];
  const dy=b[1]-a[1];

  const len=Math.hypot(
    dx,
    dy
  );


  if(len===0)
    return distance(p,a);


  return Math.abs(
    dy*p[0]-
    dx*p[1]+
    b[0]*a[1]-
    b[1]*a[0]
  )/len;
}


/* =====================================================
   ORDER CORNERS
===================================================== */

function orderCorners(points){

  const cx=
    points.reduce(
      (s,p)=>s+p[0],
      0
    )/4;

  const cy=
    points.reduce(
      (s,p)=>s+p[1],
      0
    )/4;


  const sorted=points.slice().sort(
    function(a,b){

      return Math.atan2(
        a[1]-cy,
        a[0]-cx
      )-
      Math.atan2(
        b[1]-cy,
        b[0]-cx
      );
    }
  );


  /*
    Tìm góc trên trái.
  */

  let start=0;
  let best=Infinity;

  for(let i=0;i<4;i++){

    const score=
      sorted[i][0]+
      sorted[i][1];

    if(score<best){

      best=score;
      start=i;
    }
  }


  const result=[];

  for(let i=0;i<4;i++){

    result.push(
      sorted[
        (start+i)%4
      ]
    );
  }


  /*
    Kiểm tra thứ tự.
    Cần TL -> TR -> BR -> BL.
  */

  const tl=result[0];
  const p1=result[1];
  const p2=result[2];
  const p3=result[3];


  const cross1=
    (p1[0]-tl[0])*
    (p2[1]-p1[1])-
    (p1[1]-tl[1])*
    (p2[0]-p1[0]);


  if(cross1<0){

    return [
      tl,
      p3,
      p2,
      p1
    ];
  }


  return result;
}


/* =====================================================
   POLYGON AREA
===================================================== */

function polygonArea(p){

  let sum=0;

  for(let i=0;i<p.length;i++){

    const j=(i+1)%p.length;

    sum+=
      p[i][0]*p[j][1]-
      p[j][0]*p[i][1];
  }

  return Math.abs(sum)/2;
}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

  return Math.hypot(
    a[0]-b[0],
    a[1]-b[1]
  );
}


/* =====================================================
   HOMOGRAPHY
===================================================== */

function computeHomography(
  src,
  dst
){

  const A=[];
  const B=[];


  for(let i=0;i<4;i++){

    const x=src[i][0];
    const y=src[i][1];

    const X=dst[i][0];
    const Y=dst[i][1];


    A.push([
      x,y,1,
      0,0,0,
      -X*x,-X*y
    ]);

    B.push(X);


    A.push([
      0,0,0,
      x,y,1,
      -Y*x,-Y*y
    ]);

    B.push(Y);
  }


  const h=solveLinear(
    A,
    B
  );


  if(!h)
    return null;


  return [
    h[0],h[1],h[2],
    h[3],h[4],h[5],
    h[6],h[7]
  ];
}


/* =====================================================
   LINEAR SOLVER
===================================================== */

function solveLinear(A,b){

  const n=A.length;

  const M=A.map(
    (row,i)=>
      row.concat([b[i]])
  );


  for(let col=0;col<n;col++){

    let pivot=col;


    for(
      let row=col+1;
      row<n;
      row++
    ){

      if(
        Math.abs(
          M[row][col]
        )>
        Math.abs(
          M[pivot][col]
        )
      ){

        pivot=row;
      }
    }


    if(
      Math.abs(
        M[pivot][col]
      )<1e-10
    ){

      return null;
    }


    const temp=M[col];

    M[col]=M[pivot];
    M[pivot]=temp;


    const div=
      M[col][col];


    for(
      let j=col;
      j<=n;
      j++
    ){

      M[col][j]/=div;
    }


    for(
      let row=0;
      row<n;
      row++
    ){

      if(row===col)
        continue;


      const factor=
        M[row][col];


      for(
        let j=col;
        j<=n;
        j++
      ){

        M[row][j]-=
          factor*M[col][j];
      }
    }
  }


  return M.map(
    row=>row[n]
  );
}


/* =====================================================
   PERSPECTIVE WARP
===================================================== */

function perspectiveWarp(
  img,
  corners
){

  const tl=corners[0];
  const tr=corners[1];
  const br=corners[2];
  const bl=corners[3];


  const width=Math.max(
    distance(tl,tr),
    distance(bl,br)
  );

  const height=Math.max(
    distance(tl,bl),
    distance(tr,br)
  );


  let outW=Math.round(width);
  let outH=Math.round(height);


  /*
    Giới hạn để iPhone không quá tải.
  */

  const maxW=1800;
  const maxH=2400;

  const scale=Math.min(
    1,
    maxW/outW,
    maxH/outH
  );


  outW=Math.max(
    500,
    Math.round(outW*scale)
  );

  outH=Math.max(
    500,
    Math.round(outH*scale)
  );


  /*
    Rectangle đích.
  */

  const dst=[
    [0,0],
    [outW-1,0],
    [outW-1,outH-1],
    [0,outH-1]
  ];


  const H=computeHomography(
    dst,
    [
      tl,
      tr,
      br,
      bl
    ]
  );


  if(!H)
    return img.src;


  /*
    Đọc ảnh nguồn.
  */

  const srcCanvas=
    document.createElement(
      "canvas"
    );

  srcCanvas.width=img.width;
  srcCanvas.height=img.height;

  const sctx=
    srcCanvas.getContext(
      "2d",
      {willReadFrequently:true}
    );

  sctx.drawImage(
    img,
    0,
    0
  );


  const src=
    sctx.getImageData(
      0,
      0,
      img.width,
      img.height
    );


  /*
    Canvas kết quả.
  */

  const outCanvas=
    document.createElement(
      "canvas"
    );

  outCanvas.width=outW;
  outCanvas.height=outH;


  const octx=
    outCanvas.getContext(
      "2d"
    );


  const out=
    octx.createImageData(
      outW,
      outH
    );


  /*
    Warp từng pixel.
  */

  for(let y=0;y<outH;y++){

    for(let x=0;x<outW;x++){

      const den=
        H[6]*x+
        H[7]*y+
        1;


      const sx=
        (
          H[0]*x+
          H[1]*y+
          H[2]
        )/den;


      const sy=
        (
          H[3]*x+
          H[4]*y+
          H[5]
        )/den;


      const ix=Math.floor(sx);
      const iy=Math.floor(sy);

      const fx=sx-ix;
      const fy=sy-iy;


      const oi=
        (y*outW+x)*4;


      if(
        ix<0||
        iy<0||
        ix>=img.width-1||
        iy>=img.height-1
      ){

        out.data[oi]=255;
        out.data[oi+1]=255;
        out.data[oi+2]=255;
        out.data[oi+3]=255;

        continue;
      }


      const p00=
        (iy*img.width+ix)*4;

      const p10=p00+4;

      const p01=
        p00+
        img.width*4;

      const p11=p01+4;


      for(let c=0;c<3;c++){

        const a=
          src.data[p00+c]*
          (1-fx)+
          src.data[p10+c]*
          fx;


        const b=
          src.data[p01+c]*
          (1-fx)+
          src.data[p11+c]*
          fx;


        out.data[oi+c]=
          Math.round(
            a*(1-fy)+
            b*fy
          );
      }


      out.data[oi+3]=255;
    }
  }


  octx.putImageData(
    out,
    0,
    0
  );


  return outCanvas.toDataURL(
    "image/jpeg",
    .94
  );
}


/* =====================================================
   HIỂN THỊ TRANG
===================================================== */

function showPage(src){

  const box=
    document.createElement(
      "div"
    );

  box.className="thumb";


  const img=
    document.createElement(
      "img"
    );

  img.src=src;


  const number=
    document.createElement(
      "span"
    );

  number.textContent=
    pages.length;


  box.appendChild(img);
  box.appendChild(number);

  pagesBox.appendChild(box);
}


/* =====================================================
   CLEAR
===================================================== */

function clearPages(){

  pages=[];

  preview.removeAttribute(
    "src"
  );

  pagesBox.innerHTML="";

  clearBtn.style.display=
    "none";

  status("Sẵn sàng");
}


/* =====================================================
   PDF
===================================================== */

async function makePDF(){

  if(!pages.length){

    alert(
      "Hãy chụp hoặc chọn ảnh trước."
    );

    return;
  }


  status("⏳ Đang tạo PDF...");

  pdfBtn.disabled=true;


  try{

    await loadJsPDF();


    const jsPDF=
      window.jspdf.jsPDF;


    const pdf=
      new jsPDF({
        orientation:"p",
        unit:"mm",
        format:"a4"
      });


    for(
      let i=0;
      i<pages.length;
      i++
    ){

      if(i>0)
        pdf.addPage();


      const img=
        await loadImage(
          pages[i]
        );


      const ratio=
        img.width/
        img.height;


      let w=190;
      let h=w/ratio;


      if(h>277){

        h=277;
        w=h*ratio;
      }


      pdf.addImage(
        img,
        "JPEG",
        (210-w)/2,
        (297-h)/2,
        w,
        h
      );
    }


    pdf.save(
      "DocScan-"+
      Date.now()+
      ".pdf"
    );


    status("✅ Đã tạo PDF");

  }catch(error){

    console.error(error);

    status("❌ Lỗi tạo PDF");

    alert(
      "Không tạo được PDF."
    );

  }finally{

    pdfBtn.disabled=false;
  }
}


/* =====================================================
   LOAD JSPDF
===================================================== */

function loadJsPDF(){

  if(window.jspdf)
    return Promise.resolve();


  return new Promise(
    function(resolve,reject){

      const script=
        document.createElement(
          "script"
        );


      script.src=
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";


      script.onload=resolve;

      script.onerror=reject;


      document.head.appendChild(
        script
      );
    }
  );
}


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(url){

  return new Promise(
    function(resolve,reject){

      const img=new Image();

      img.onload=function(){
        resolve(img);
      };

      img.onerror=reject;

      img.src=url;
    }
  );
}
