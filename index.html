<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>DocScan</title>

<!-- AI tự nhận diện 4 góc tài liệu -->
<script src="https://cdn.jsdelivr.net/npm/quadscan/dist/quadscan.iife.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:700;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
.status{
  background:white;
  border-radius:14px;
  padding:16px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 2px 10px #0001;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  border:0;
  border-radius:14px;
  padding:17px 10px;
  font-size:17px;
  font-weight:600;
  background:#111;
  color:white;
}
button:disabled{
  opacity:.45;
}
.pdf{
  width:100%;
  margin-top:12px;
  background:#555;
}
input{
  display:none;
}
.page{
  background:white;
  border-radius:14px;
  padding:10px;
  margin-top:18px;
  box-shadow:0 2px 10px #0001;
}
.page img{
  width:100%;
  display:block;
  border-radius:8px;
}
.remove{
  width:100%;
  margin-top:8px;
  padding:10px;
  font-size:14px;
  background:#ddd;
  color:#111;
}
#pages:empty:after{
  content:"Chưa có ảnh";
  display:block;
  text-align:center;
  color:#888;
  padding:25px;
}
</style>
</head>

<body>

<header>📄 DocScan</header>

<div class="container">

  <div class="status" id="status">
    🟢 Sẵn sàng
  </div>

  <div class="buttons">

    <button onclick="cameraInput.click()">
      📷 Chụp
    </button>

    <button onclick="galleryInput.click()">
      🖼️ Thư viện
    </button>

  </div>

  <input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <input
    id="galleryInput"
    type="file"
    accept="image/*"
    multiple
  >

  <button
    class="pdf"
    id="pdfButton"
    onclick="makePDF()"
    disabled
  >
    📄 Xuất PDF
  </button>

  <div id="pages"></div>

</div>

<script>

const cameraInput = document.getElementById("cameraInput");
const galleryInput = document.getElementById("galleryInput");
const statusBox = document.getElementById("status");
const pagesBox = document.getElementById("pages");
const pdfButton = document.getElementById("pdfButton");

let pages = [];


/* =========================
   CHỤP ẢNH
========================= */

cameraInput.addEventListener("change", async function(){
  if(this.files && this.files[0]){
    await scanFile(this.files[0]);
  }

  this.value = "";
});


/* =========================
   THƯ VIỆN
========================= */

galleryInput.addEventListener("change", async function(){

  if(!this.files) return;

  for(const file of this.files){
    await scanFile(file);
  }

  this.value = "";
});


/* =========================
   QUÉT TÀI LIỆU
========================= */

async function scanFile(file){

  if(!file.type.startsWith("image/")){
    return;
  }

  statusBox.innerHTML =
    "🤖 Đang nhận diện 4 góc tài liệu...";

  pdfButton.disabled = true;

  try{

    /*
      Quadscan tự:
      1. Nhận diện tài liệu
      2. Tìm 4 góc
      3. Sửa phối cảnh
      4. Trả canvas đã căn thẳng
    */

    const result = await Quadscan.scan(
      file,
      {
        mode:"extract"
      }
    );

    if(
      !result ||
      !result.success ||
      !result.output
    ){
      throw new Error(
        "Không nhận diện được tài liệu"
      );
    }

    const canvas = result.output;

    const imageData =
      canvas.toDataURL(
        "image/jpeg",
        0.94
      );

    pages.push(imageData);

    renderPages();

    statusBox.innerHTML =
      "✅ Đã tự căn tài liệu";

    pdfButton.disabled = false;

  }catch(error){

    console.error(error);

    statusBox.innerHTML =
      "❌ Không nhận diện được 4 góc tài liệu";

  }

}


/* =========================
   HIỂN THỊ CÁC TRANG
========================= */

function renderPages(){

  pagesBox.innerHTML = "";

  pages.forEach((src,index)=>{

    const page =
      document.createElement("div");

    page.className = "page";

    page.innerHTML = `
      <img src="${src}">
      <button
        class="remove"
        onclick="removePage(${index})"
      >
        🗑️ Xóa trang ${index+1}
      </button>
    `;

    pagesBox.appendChild(page);

  });

}


/* =========================
   XÓA TRANG
========================= */

function removePage(index){

  pages.splice(index,1);

  renderPages();

  pdfButton.disabled =
    pages.length === 0;

}


/* =========================
   TẠO PDF
========================= */

async function makePDF(){

  if(!pages.length) return;

  statusBox.innerHTML =
    "📄 Đang tạo PDF...";

  try{

    if(!window.jspdf){

      await loadJsPDF();

    }

    const { jsPDF } = window.jspdf;

    let pdf = null;

    for(let i=0;i<pages.length;i++){

      const img = new Image();

      await new Promise((resolve,reject)=>{

        img.onload = resolve;
        img.onerror = reject;

        img.src = pages[i];

      });

      const width = img.naturalWidth;
      const height = img.naturalHeight;

      const orientation =
        width > height
        ? "landscape"
        : "portrait";

      if(i === 0){

        pdf = new jsPDF({
          orientation,
          unit:"px",
          format:[width,height]
        });

      }else{

        pdf.addPage(
          [width,height],
          orientation
        );

      }

      pdf.addImage(
        pages[i],
        "JPEG",
        0,
        0,
        width,
        height
      );

    }

    pdf.save(
      "DocScan-" +
      new Date()
        .toISOString()
        .slice(0,10) +
      ".pdf"
    );

    statusBox.innerHTML =
      "✅ Đã tạo PDF";

  }catch(error){

    console.error(error);

    statusBox.innerHTML =
      "❌ Không tạo được PDF";

  }

}


/* =========================
   LOAD jsPDF
========================= */

function loadJsPDF(){

  return new Promise((resolve,reject)=>{

    const script =
      document.createElement("script");

    script.src =
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

    script.onload = resolve;
    script.onerror = reject;

    document.head.appendChild(script);

  });

}

</script>

</body>
</html>
