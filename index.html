<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">

<title>DocScan</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

header {
    padding: 18px 16px 10px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
}

.sub {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 15px;
}

.controls {
    display: flex;
    gap: 10px;
    padding: 0 14px 15px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 14px;
    padding: 15px 10px;
    font-size: 16px;
    font-weight: 600;
    background: white;
    color: #111;
}

button.secondary {
    background: #333;
    color: white;
}

input {
    display: none;
}

#status {
    text-align: center;
    color: #aaa;
    min-height: 22px;
    padding: 5px 15px 15px;
    font-size: 14px;
}

#pages {
    padding: 0 12px 30px;
}

.page {
    background: #222;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 15px;
}

.page img {
    width: 100%;
    display: block;
    border-radius: 8px;
}

.page-number {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-top: 8px;
}

canvas {
    display: none;
}
</style>
</head>

<body>

<header>📄 DocScan</header>

<div class="sub">
Tự động nhận diện mép giấy
</div>

<div class="controls">

    <button onclick="openCamera()">
        📷 Chụp
    </button>

    <button class="secondary" onclick="openGallery()">
        🖼️ Thư viện
    </button>

    <button class="secondary" onclick="makePDF()">
        📑 PDF
    </button>

</div>

<input
    id="camera"
    type="file"
    accept="image/*"
    capture="environment"
>

<input
    id="gallery"
    type="file"
    accept="image/*"
    multiple
>

<div id="status">
Đang khởi động bộ nhận diện...
</div>

<div id="pages"></div>

<canvas id="canvas"></canvas>


<script>

let cvReady = false;
let pages = [];

const camera = document.getElementById("camera");
const gallery = document.getElementById("gallery");
const statusEl = document.getElementById("status");
const pagesEl = document.getElementById("pages");
const canvas = document.getElementById("canvas");


/* =========================
   KHỞI ĐỘNG OPENCV
========================= */

function checkOpenCV() {

    if (
        typeof cv !== "undefined" &&
        cv.Mat
    ) {
        cvReady = true;

        statusEl.innerText =
            "Sẵn sàng — hãy chụp hoặc chọn ảnh";

    } else {

        setTimeout(checkOpenCV, 300);

    }
}

checkOpenCV();


/* =========================
   MỞ CAMERA / GALLERY
========================= */

function openCamera() {

    camera.value = "";
    camera.click();

}

function openGallery() {

    gallery.value = "";
    gallery.click();

}

camera.addEventListener(
    "change",
    handleFiles
);

gallery.addEventListener(
    "change",
    handleFiles
);


/* =========================
   ĐỌC FILE
========================= */

async function handleFiles(e) {

    const files = Array.from(e.target.files || []);

    if (!files.length) return;

    if (!cvReady) {

        alert("Bộ nhận diện chưa tải xong. Vui lòng đợi vài giây rồi thử lại.");

        return;
    }

    for (const file of files) {

        try {

            statusEl.innerText =
                "🔍 Đang tự nhận diện mép giấy...";

            const img = await loadImage(file);

            const result =
                scanDocument(img);

            pages.push(result);

            renderPages();

        } catch (err) {

            console.error(err);

            statusEl.innerText =
                "Không xử lý được ảnh.";

        }

    }

    statusEl.innerText =
        `Đã xử lý ${files.length} ảnh`;

}


/* =========================
   LOAD IMAGE
========================= */

function loadImage(file) {

    return new Promise(
        (resolve, reject) => {

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload = () => {

                URL.revokeObjectURL(url);

                resolve(img);

            };

            img.onerror = reject;

            img.src = url;

        }
    );

}


/* =========================
   SCAN DOCUMENT
========================= */

function scanDocument(img) {

    /*
       Giới hạn ảnh xử lý để iPhone
       không bị quá tải RAM.
    */

    const MAX = 1800;

    let scale =
        Math.min(
            1,
            MAX / Math.max(img.width, img.height)
        );

    const w =
        Math.round(img.width * scale);

    const h =
        Math.round(img.height * scale);

    canvas.width = w;
    canvas.height = h;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        img,
        0,
        0,
        w,
        h
    );

    const src =
        cv.imread(canvas);

    const corners =
        findDocumentCorners(src);

    let result;

    if (corners) {

        result =
            perspectiveCorrect(
                src,
                corners
            );

    } else {

        /*
          Không tìm thấy đủ tin cậy:
          giữ ảnh gốc thay vì cắt sai.
        */

        result =
            src.clone();

    }

    src.delete();

    return matToDataURL(result);

}


/* =========================
   TÌM 4 GÓC TỜ GIẤY
========================= */

function findDocumentCorners(src) {

    const originalW =
        src.cols;

    const originalH =
        src.rows;


    /*
       1. GRAYSCALE
    */

    const gray =
        new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    /*
       2. BLUR
    */

    const blur =
        new cv.Mat();

    cv.GaussianBlur(
        gray,
        blur,
        new cv.Size(5, 5),
        0,
        0,
        cv.BORDER_DEFAULT
    );


    /*
       3. CANNY
    */

    const edges =
        new cv.Mat();

    cv.Canny(
        blur,
        edges,
        35,
        120
    );


    /*
       4. NỐI ĐƯỜNG VIỀN
       để mép giấy bị đứt
       vẫn có cơ hội thành contour.
    */

    const kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(5, 5)
        );

    cv.morphologyEx(
        edges,
        edges,
        cv.MORPH_CLOSE,
        kernel
    );


    /*
       5. TÌM CONTOUR
    */

    const contours =
        new cv.MatVector();

    const hierarchy =
        new cv.Mat();

    cv.findContours(
        edges,
        contours,
        hierarchy,
        cv.RETR_LIST,
        cv.CHAIN_APPROX_SIMPLE
    );


    let best = null;
    let bestScore = -Infinity;


    /*
       6. XÉT TỪNG CONTOUR
    */

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);

        const area =
            Math.abs(
                cv.contourArea(contour)
            );

        const imageArea =
            originalW * originalH;


        /*
           Tờ giấy phải chiếm
           một phần đáng kể ảnh.
        */

        if (
            area <
            imageArea * 0.12
        ) {

            contour.delete();
            continue;

        }


        /*
           Approx polygon
        */

        const peri =
            cv.arcLength(
                contour,
                true
            );

        const approx =
            new cv.Mat();

        cv.approxPolyDP(
            contour,
            approx,
            0.02 * peri,
            true
        );


        if (
            approx.rows === 4 &&
            cv.isContourConvex(approx)
        ) {

            const pts = [];

            for (
                let j = 0;
                j < 4;
                j++
            ) {

                pts.push({
                    x:
                        approx.intAt(j, 0),
                    y:
                        approx.intAt(j, 1)
                });

            }


            /*
               Sắp xếp TL/TR/BR/BL
            */

            const ordered =
                orderCorners(pts);


            /*
               Tính kích thước 4 cạnh
            */

            const widthTop =
                distance(
                    ordered[0],
                    ordered[1]
                );

            const widthBottom =
                distance(
                    ordered[3],
                    ordered[2]
                );

            const heightLeft =
                distance(
                    ordered[0],
                    ordered[3]
                );

            const heightRight =
                distance(
                    ordered[1],
                    ordered[2]
                );

            const width =
                Math.max(
                    widthTop,
                    widthBottom
                );

            const height =
                Math.max(
                    heightLeft,
                    heightRight
                );


            if (
                width < 150 ||
                height < 150
            ) {

                approx.delete();
                contour.delete();

                continue;

            }


            /*
               Tỷ lệ khung giấy.
               Cho phép giấy A4 dọc,
               A4 ngang và các tài liệu
               gần vuông.
            */

            const ratio =
                Math.max(width, height) /
                Math.min(width, height);


            if (
                ratio > 4.0
            ) {

                approx.delete();
                contour.delete();

                continue;

            }


            /*
               Góc phải khoảng 90 độ.
               Không bắt buộc tuyệt đối.
            */

            let angleScore = 0;

            for (
                let j = 0;
                j < 4;
                j++
            ) {

                const a =
                    ordered[
                        (j + 3) % 4
                    ];

                const b =
                    ordered[j];

                const c =
                    ordered[
                        (j + 1) % 4
                    ];

                const angle =
                    cornerAngle(
                        a,
                        b,
                        c
                    );

                const diff =
                    Math.abs(
                        angle - 90
                    );

                angleScore +=
                    Math.max(
                        0,
                        1 - diff / 60
                    );

            }

            angleScore /= 4;


            /*
               Diện tích càng lớn càng tốt.
            */

            const areaScore =
                Math.min(
                    1,
                    area / imageArea
                );


            /*
               Ưu tiên contour:
               - lớn
               - gần hình chữ nhật
               - không quá dài
            */

            let score =
                areaScore * 65 +
                angleScore * 35;


            /*
               Bonus nếu tờ giấy
               nằm tương đối trong ảnh.
            */

            const centerX =
                (
                    ordered[0].x +
                    ordered[1].x +
                    ordered[2].x +
                    ordered[3].x
                ) / 4;

            const centerY =
                (
                    ordered[0].y +
                    ordered[1].y +
                    ordered[2].y +
                    ordered[3].y
                ) / 4;

            const dx =
                Math.abs(
                    centerX -
                    originalW / 2
                ) /
                (originalW / 2);

            const dy =
                Math.abs(
                    centerY -
                    originalH / 2
                ) /
                (originalH / 2);

            score +=
                Math.max(
                    0,
                    10 - (dx + dy) * 5
                );


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                best =
                    ordered;

            }

        }


        approx.delete();
        contour.delete();

    }


    /*
       Dọn RAM
    */

    gray.delete();
    blur.delete();
    edges.delete();
    kernel.delete();
    contours.delete();
    hierarchy.delete();


    /*
       Chỉ chấp nhận kết quả
       đủ tốt.
    */

    if (
        !best ||
        bestScore < 45
    ) {

        return null;

    }


    return best;

}


/* =========================
   SẮP XẾP 4 GÓC
========================= */

function orderCorners(points) {

    const sum =
        p => p.x + p.y;

    const diff =
        p => p.x - p.y;


    const tl =
        points.reduce(
            (a, b) =>
                sum(a) < sum(b)
                    ? a
                    : b
        );

    const br =
        points.reduce(
            (a, b) =>
                sum(a) > sum(b)
                    ? a
                    : b
        );

    const tr =
        points.reduce(
            (a, b) =>
                diff(a) > diff(b)
                    ? a
                    : b
        );

    const bl =
        points.reduce(
            (a, b) =>
                diff(a) < diff(b)
                    ? a
                    : b
        );

    return [
        tl,
        tr,
        br,
        bl
    ];

}


/* =========================
   KHOẢNG CÁCH
========================= */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* =========================
   GÓC
========================= */

function cornerAngle(
    a,
    b,
    c
) {

    const abx =
        a.x - b.x;

    const aby =
        a.y - b.y;

    const cbx =
        c.x - b.x;

    const cby =
        c.y - b.y;

    const dot =
        abx * cbx +
        aby * cby;

    const mag1 =
        Math.hypot(
            abx,
            aby
        );

    const mag2 =
        Math.hypot(
            cbx,
            cby
        );

    if (
        mag1 === 0 ||
        mag2 === 0
    ) {

        return 0;

    }

    let cos =
        dot /
        (mag1 * mag2);

    cos =
        Math.max(
            -1,
            Math.min(1, cos)
        );

    return (
        Math.acos(cos) *
        180 /
        Math.PI
    );

}


/* =========================
   PERSPECTIVE CORRECTION
========================= */

function perspectiveCorrect(
    src,
    p
) {

    const widthTop =
        distance(
            p[0],
            p[1]
        );

    const widthBottom =
        distance(
            p[3],
            p[2]
        );

    const heightLeft =
        distance(
            p[0],
            p[3]
        );

    const heightRight =
        distance(
            p[1],
            p[2]
        );


    let width =
        Math.round(
            Math.max(
                widthTop,
                widthBottom
            )
        );

    let height =
        Math.round(
            Math.max(
                heightLeft,
                heightRight
            )
        );


    /*
       Không cho output quá lớn
    */

    const MAX =
        1800;

    const scale =
        Math.min(
            1,
            MAX /
            Math.max(
                width,
                height
            )
        );

    width =
        Math.round(
            width * scale
        );

    height =
        Math.round(
            height * scale
        );


    const srcPts =
        cv.matFromArray(
            4,
            1,
            cv.CV_32FC2,
            [
                p[0].x,
                p[0].y,

                p[1].x,
                p[1].y,

                p[2].x,
                p[2].y,

                p[3].x,
                p[3].y
            ]
        );


    const dstPts =
        cv.matFromArray(
            4,
            1,
            cv.CV_32FC2,
            [
                0,
                0,

                width,
                0,

                width,
                height,

                0,
                height
            ]
        );


    const M =
        cv.getPerspectiveTransform(
            srcPts,
            dstPts
        );


    const dst =
        new cv.Mat();

    cv.warpPerspective(
        src,
        dst,
        M,
        new cv.Size(
            width,
            height
        ),
        cv.INTER_CUBIC,
        cv.BORDER_CONSTANT,
        new cv.Scalar(
            255,
            255,
            255,
            255
        )
    );


    /*
       Tăng nhẹ độ tương phản
       để tài liệu dễ đọc.
    */

    const gray =
        new cv.Mat();

    cv.cvtColor(
        dst,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    const enhanced =
        new cv.Mat();

    cv.convertScaleAbs(
        gray,
        enhanced,
        1.08,
        4
    );


    /*
       Giữ ảnh màu nếu cần.
       Ở đây dùng grayscale
       cho kiểu scan tài liệu.
    */

    const output =
        new cv.Mat();

    cv.cvtColor(
        enhanced,
        output,
        cv.COLOR_GRAY2RGBA
    );


    srcPts.delete();
    dstPts.delete();
    M.delete();
    dst.delete();
    gray.delete();
    enhanced.delete();

    return output;

}


/* =========================
   MAT → DATA URL
========================= */

function matToDataURL(mat) {

    canvas.width =
        mat.cols;

    canvas.height =
        mat.rows;

    cv.imshow(
        canvas,
        mat
    );

    const data =
        canvas.toDataURL(
            "image/jpeg",
            0.92
        );

    mat.delete();

    return data;

}


/* =========================
   HIỂN THỊ TRANG
========================= */

function renderPages() {

    pagesEl.innerHTML = "";

    pages.forEach(
        (src, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "page";

            div.innerHTML = `
                <img src="${src}">
                <div class="page-number">
                    Trang ${index + 1}
                </div>
            `;

            pagesEl.appendChild(
                div
            );

        }
    );

}


/* =========================
   TẠO PDF
========================= */

async function makePDF() {

    if (!pages.length) {

        alert(
            "Chưa có ảnh nào."
        );

        return;

    }


    statusEl.innerText =
        "📑 Đang tạo PDF...";


    const {
        jsPDF
    } = window.jspdf;


    const pdf =
        new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });


    for (
        let i = 0;
        i < pages.length;
        i++
    ) {

        if (i > 0) {

            pdf.addPage();

        }


        const img =
            await loadImageFromURL(
                pages[i]
            );


        const pageW =
            210;

        const pageH =
            297;


        const ratio =
            Math.min(
                pageW / img.width,
                pageH / img.height
            );


        const w =
            img.width * ratio;

        const h =
            img.height * ratio;


        const x =
            (pageW - w) / 2;

        const y =
            (pageH - h) / 2;


        pdf.addImage(
            pages[i],
            "JPEG",
            x,
            y,
            w,
            h,
            undefined,
            "FAST"
        );

    }


    pdf.save(
        "DocScan.pdf"
    );


    statusEl.innerText =
        "✅ PDF đã tạo xong";

}


/* =========================
   LOAD DATA URL
========================= */

function loadImageFromURL(url) {

    return new Promise(
        resolve => {

            const img =
                new Image();

            img.onload = () =>
                resolve(img);

            img.src = url;

        }
    );

}

</script>

</body>
</html>
