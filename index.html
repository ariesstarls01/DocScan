<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>DocScan</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:#111;
  color:#fff;
  padding:22px 15px;
  text-align:center;
  font-size:24px;
  font-weight:700;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

.status{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  text-align:center;
  box-shadow:0 3px 15px #0001;
  font-size:17px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:16px;
  padding:18px 10px;
  font-size:18px;
  font-weight:600;
  background:#111;
  color:#fff;
}

button:disabled{
  opacity:.4;
}

.pdf{
  width:100%;
  margin-top:12px;
  background:#555;
}

input{
  display:none;
}

.page{
  background:#fff;
  border-radius:16px;
  padding:10px;
  margin-top:18px;
  box-shadow:0 3px 15px #0001;
}

.page img{
  width:100%;
  display:block;
  border-radius:10px;
}

.remove{
  width:100%;
  margin-top:8px;
  padding:10px;
  background:#ddd;
  color:#111;
  font-size:14px;
}

.error{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:#fff0f0;
  color:#a00000;
  font-size:13px;
  word-break:break-word;
}
</style>
</head>

<body>

<header>
  📄 DocScan
</header>

<div class="container">

  <div class="status" id="status">
    ⏳ Đang tải bộ nhận diện...
  </div>

  <div class="buttons">

    <button onclick="cameraInput.click()">
      📷 Chụp
    </button>

    <button onclick="galleryInput.click()">
      🖼️ Thư viện
    </button>

  </div>

  <input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <input
    id="galleryInput"
    type="file"
    accept="image/*"
    multiple
  >

  <button
    class="pdf"
    id="pdfButton"
    disabled
    onclick="makePDF()"
  >
    📄 Xuất PDF
  </button>

  <div id="error" class="error"></div>

  <div id="pages"></div>

</div>


<script type="module">

/*
====================================================
SCANNER
====================================================
*/

let scanDocument = null;

try {

  const Scanic =
    await import(
      "https://esm.sh/scanic@1.6.0"
    );

  scanDocument =
    Scanic.scanDocument;

  if(typeof scanDocument !== "function"){
    throw new Error(
      "Không tìm thấy scanDocument trong Scanic."
    );
  }

  setStatus("🟢 Sẵn sàng");

}
catch(error){

  console.error(error);

  setStatus("❌ Không tải được bộ nhận diện");

  showError(
    "Lỗi tải Scanic: " +
    (error.message || error)
  );

}


/*
====================================================
ELEMENTS
====================================================
*/

const cameraInput =
  document.getElementById("cameraInput");

const galleryInput =
  document.getElementById("galleryInput");

const statusBox =
  document.getElementById("status");

const pagesBox =
  document.getElementById("pages");

const pdfButton =
  document.getElementById("pdfButton");

const errorBox =
  document.getElementById("error");

let pages = [];


/*
====================================================
STATUS
====================================================
*/

function setStatus(text){

  statusBox.innerHTML = text;

}


/*
====================================================
ERROR
====================================================
*/

function showError(text){

  errorBox.style.display = "block";

  errorBox.innerHTML =
    "<b>Chi tiết:</b><br>" +
    escapeHTML(String(text));

}

function hideError(){

  errorBox.style.display = "none";

}

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/*
====================================================
CAMERA
====================================================
*/

cameraInput.addEventListener(
  "change",
  async function(){

    if(this.files && this.files[0]){

      await processFile(
        this.files[0]
      );

    }

    this.value = "";

  }
);


/*
====================================================
GALLERY
====================================================
*/

galleryInput.addEventListener(
  "change",
  async function(){

    if(!this.files) return;

    for(const file of this.files){

      await processFile(file);

    }

    this.value = "";

  }
);


/*
====================================================
LOAD IMAGE
====================================================
*/

function loadImage(file){

  return new Promise(
    (resolve,reject)=>{

      const img =
        new Image();

      const url =
        URL.createObjectURL(file);

      img.onload = ()=>{

        URL.revokeObjectURL(url);

        resolve(img);

      };

      img.onerror = ()=>{

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "Không đọc được ảnh."
          )
        );

      };

      img.src = url;

    }
  );

}


/*
====================================================
SCAN DOCUMENT
====================================================
*/

async function processFile(file){

  hideError();

  if(!scanDocument){

    showError(
      "Bộ nhận diện chưa tải xong."
    );

    return;

  }

  if(!file.type.startsWith("image/")){

    showError(
      "File được chọn không phải ảnh."
    );

    return;

  }

  setStatus(
    "🤖 Đang tự động tìm 4 góc tài liệu..."
  );

  pdfButton.disabled = true;

  try{

    /*
      File
        ↓
      Image
        ↓
      Scanic
        ↓
      tự tìm 4 góc
        ↓
      tự sửa phối cảnh
        ↓
      Canvas
    */

    const image =
      await loadImage(file);

    const result =
      await scanDocument(
        image,
        {
          mode:"extract",
          output:"canvas",

          /*
            Cho phép xử lý ảnh lớn hơn
            để giữ chất lượng tốt hơn.
          */
          maxProcessingDimension:1600
        }
      );

    console.log(
      "SCAN RESULT:",
      result
    );

    if(!result){

      throw new Error(
        "Scanner không trả về kết quả."
      );

    }

    if(!result.success){

      throw new Error(
        "Không nhận diện được tài liệu."
      );

    }

    if(!result.output){

      throw new Error(
        "Không tạo được ảnh sau khi căn."
      );

    }

    /*
      Canvas đã được Scanic
      tự sửa phối cảnh.
    */

    const canvas =
      result.output;

    const imageData =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );

    pages.push(imageData);

    renderPages();

    setStatus(
      "✅ Đã tự động căn thẳng tài liệu"
    );

    pdfButton.disabled = false;

  }
  catch(error){

    console.error(
      "SCAN ERROR:",
      error
    );

    setStatus(
      "❌ Không nhận diện được tài liệu"
    );

    showError(
      error.message || error
    );

  }

}


/*
====================================================
RENDER PAGES
====================================================
*/

function renderPages(){

  pagesBox.innerHTML = "";

  pages.forEach(
    (src,index)=>{

      const page =
        document.createElement("div");

      page.className =
        "page";

      page.innerHTML = `
        <img src="${src}">
        <button
          class="remove"
          onclick="removePage(${index})"
        >
          🗑️ Xóa trang ${index + 1}
        </button>
      `;

      pagesBox.appendChild(page);

    }
  );

}


/*
====================================================
REMOVE PAGE
====================================================
*/

window.removePage =
function(index){

  pages.splice(index,1);

  renderPages();

  pdfButton.disabled =
    pages.length === 0;

};


/*
====================================================
PDF
====================================================
*/

window.makePDF =
async function(){

  if(!pages.length) return;

  setStatus(
    "📄 Đang tạo PDF..."
  );

  try{

    if(!window.jspdf){

      await loadPDF();

    }

    const jsPDF =
      window.jspdf.jsPDF;

    let pdf = null;

    for(
      let i = 0;
      i < pages.length;
      i++
    ){

      const img =
        new Image();

      await new Promise(
        (resolve,reject)=>{

          img.onload =
            resolve;

          img.onerror =
            reject;

          img.src =
            pages[i];

        }
      );

      const width =
        img.naturalWidth;

      const height =
        img.naturalHeight;

      const orientation =
        width > height
          ? "landscape"
          : "portrait";

      if(i === 0){

        pdf =
          new jsPDF({
            orientation,
            unit:"px",
            format:[
              width,
              height
            ]
          });

      }
      else{

        pdf.addPage(
          [width,height],
          orientation
        );

      }

      pdf.addImage(
        pages[i],
        "JPEG",
        0,
        0,
        width,
        height
      );

    }

    pdf.save(
      "DocScan-" +
      new Date()
        .toISOString()
        .slice(0,10) +
      ".pdf"
    );

    setStatus(
      "✅ Đã tạo PDF"
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      "❌ Tạo PDF thất bại"
    );

    showError(
      error.message || error
    );

  }

};


/*
====================================================
LOAD PDF
====================================================
*/

function loadPDF(){

  return new Promise(
    (resolve,reject)=>{

      const script =
        document.createElement("script");

      script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

      script.onload =
        resolve;

      script.onerror =
        ()=>{
          reject(
            new Error(
              "Không tải được thư viện PDF."
            )
          );
        };

      document.head.appendChild(
        script
      );

    }
  );

}

</script>

</body>
</html>
