<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>DocScan</title>

<!-- KHÔNG dùng async ở OpenCV -->
<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

header {
    text-align: center;
    padding-top: 28px;
    font-size: 30px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-top: 8px;
    margin-bottom: 22px;
    font-size: 16px;
}

.buttons {
    display: flex;
    gap: 10px;
    padding: 0 14px;
}

button {
    flex: 1;
    border: none;
    border-radius: 16px;
    padding: 16px 8px;
    font-size: 17px;
    font-weight: 700;
    background: white;
    color: #111;
}

button.dark {
    background: #333;
    color: white;
}

button:active {
    transform: scale(0.97);
}

input {
    display: none;
}

#status {
    text-align: center;
    color: #aaa;
    min-height: 28px;
    margin: 22px 15px 12px;
    font-size: 15px;
}

#pages {
    padding: 0 12px 40px;
}

.page {
    background: #222;
    padding: 10px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.page img {
    display: block;
    width: 100%;
    border-radius: 9px;
}

.page-title {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-top: 8px;
}

canvas {
    display: none;
}

</style>
</head>


<body>

<header>📄 DocScan</header>

<div class="subtitle">
Tự động nhận diện mép giấy
</div>


<div class="buttons">

    <button onclick="openCamera()">
        📷 Chụp
    </button>

    <button class="dark" onclick="openGallery()">
        🖼️ Thư viện
    </button>

    <button class="dark" onclick="makePDF()">
        📑 PDF
    </button>

</div>


<input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
>

<input
    id="galleryInput"
    type="file"
    accept="image/*"
    multiple
>


<div id="status">
⏳ Đang khởi động bộ nhận diện...
</div>


<div id="pages"></div>


<canvas id="workCanvas"></canvas>


<script>

/* =========================================================
   BIẾN
========================================================= */

let cvReady = false;

let pages = [];

const cameraInput =
    document.getElementById("cameraInput");

const galleryInput =
    document.getElementById("galleryInput");

const statusBox =
    document.getElementById("status");

const pagesBox =
    document.getElementById("pages");

const canvas =
    document.getElementById("workCanvas");


/* =========================================================
   KHỞI ĐỘNG OPENCV
========================================================= */

function initOpenCV() {

    if (typeof cv === "undefined") {

        statusBox.innerText =
            "⏳ Đang tải bộ nhận diện...";

        setTimeout(initOpenCV, 500);

        return;
    }


    /*
       OpenCV chưa chạy xong WebAssembly
    */

    if (cv.Mat === undefined) {

        cv["onRuntimeInitialized"] =
            function () {

                cvReady = true;

                statusBox.innerText =
                    "✅ Sẵn sàng — hãy chụp hoặc chọn ảnh";

            };

        return;
    }


    /*
       Một số trình duyệt tải OpenCV
       xong trước khi đoạn trên chạy
    */

    cvReady = true;

    statusBox.innerText =
        "✅ Sẵn sàng — hãy chụp hoặc chọn ảnh";
}


initOpenCV();


/* =========================================================
   CAMERA
========================================================= */

function openCamera() {

    if (!cvReady) {

        alert(
            "Bộ nhận diện chưa tải xong. Hãy đợi vài giây."
        );

        return;
    }

    cameraInput.value = "";

    cameraInput.click();
}


/* =========================================================
   THƯ VIỆN
========================================================= */

function openGallery() {

    if (!cvReady) {

        alert(
            "Bộ nhận diện chưa tải xong. Hãy đợi vài giây."
        );

        return;
    }

    galleryInput.value = "";

    galleryInput.click();
}


/* =========================================================
   INPUT
========================================================= */

cameraInput.addEventListener(
    "change",
    handleFiles
);

galleryInput.addEventListener(
    "change",
    handleFiles
);


/* =========================================================
   XỬ LÝ FILE
========================================================= */

async function handleFiles(event) {

    const files =
        Array.from(
            event.target.files || []
        );

    if (!files.length) {
        return;
    }


    for (let i = 0; i < files.length; i++) {

        try {

            statusBox.innerText =
                `🔍 Đang quét trang ${i + 1}/${files.length}...`;

            const image =
                await loadImage(files[i]);


            const result =
                scanDocument(image);


            pages.push(result);


            renderPages();


        } catch (error) {

            console.error(error);

            statusBox.innerText =
                "⚠️ Không xử lý được ảnh.";

        }

    }


    statusBox.innerText =
        `✅ Đã quét ${files.length} trang`;

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(file) {

    return new Promise(
        function(resolve, reject) {

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();


            img.onload =
                function() {

                    URL.revokeObjectURL(url);

                    resolve(img);

                };


            img.onerror =
                function() {

                    URL.revokeObjectURL(url);

                    reject(
                        new Error(
                            "Không đọc được ảnh"
                        )
                    );

                };


            img.src = url;

        }
    );

}


/* =========================================================
   SCAN DOCUMENT
========================================================= */

function scanDocument(image) {

    /*
       Giới hạn kích thước xử lý.
       Giữ ảnh đủ nét nhưng tránh iPhone
       bị quá tải RAM.
    */

    const MAX_SIZE = 2200;


    let scale =
        Math.min(
            1,
            MAX_SIZE /
            Math.max(
                image.naturalWidth,
                image.naturalHeight
            )
        );


    const width =
        Math.max(
            1,
            Math.round(
                image.naturalWidth * scale
            )
        );


    const height =
        Math.max(
            1,
            Math.round(
                image.naturalHeight * scale
            )
        );


    canvas.width = width;
    canvas.height = height;


    const context =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    context.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const src =
        cv.imread(canvas);


    let corners = null;


    try {

        corners =
            detectPaper(src);

    } catch (error) {

        console.error(
            "Detection error:",
            error
        );

    }


    let output;


    if (corners) {

        output =
            correctPerspective(
                src,
                corners
            );

    } else {

        /*
           Nếu không chắc chắn,
           KHÔNG cắt sai giấy.
        */

        output =
            src.clone();

    }


    src.delete();


    return matToDataURL(output);

}


/* =========================================================
   NHẬN DIỆN TỜ GIẤY
========================================================= */

function detectPaper(src) {

    const W =
        src.cols;

    const H =
        src.rows;

    const imageArea =
        W * H;


    /* ---------------------------------------------
       GRAYSCALE
    --------------------------------------------- */

    const gray =
        new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    /* ---------------------------------------------
       BLUR
    --------------------------------------------- */

    const blurred =
        new cv.Mat();

    cv.GaussianBlur(
        gray,
        blurred,
        new cv.Size(5, 5),
        0
    );


    /* ---------------------------------------------
       EDGE
    --------------------------------------------- */

    const edges =
        new cv.Mat();

    cv.Canny(
        blurred,
        edges,
        30,
        100
    );


    /* ---------------------------------------------
       NỐI MÉP ĐỨT
    --------------------------------------------- */

    const kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(7, 7)
        );


    cv.morphologyEx(
        edges,
        edges,
        cv.MORPH_CLOSE,
        kernel
    );


    /* ---------------------------------------------
       TÌM CONTOUR
    --------------------------------------------- */

    const contours =
        new cv.MatVector();

    const hierarchy =
        new cv.Mat();


    cv.findContours(
        edges,
        contours,
        hierarchy,
        cv.RETR_LIST,
        cv.CHAIN_APPROX_SIMPLE
    );


    let best = null;

    let bestScore = 0;


    /* ---------------------------------------------
       DUYỆT CONTOUR
    --------------------------------------------- */

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);


        const area =
            Math.abs(
                cv.contourArea(contour)
            );


        /*
           Bỏ những vùng quá nhỏ.
        */

        if (
            area <
            imageArea * 0.10
        ) {

            contour.delete();

            continue;

        }


        /*
           Chu vi
        */

        const perimeter =
            cv.arcLength(
                contour,
                true
            );


        /*
           Xấp xỉ polygon
        */

        const approx =
            new cv.Mat();


        cv.approxPolyDP(
            contour,
            approx,
            0.018 * perimeter,
            true
        );


        /*
           Phải có đúng 4 góc
        */

        if (
            approx.rows !== 4
        ) {

            approx.delete();
            contour.delete();

            continue;

        }


        /*
           Lấy 4 điểm
        */

        let points = [];


        for (
            let j = 0;
            j < 4;
            j++
        ) {

            points.push({

                x:
                    approx.intAt(
                        j,
                        0
                    ),

                y:
                    approx.intAt(
                        j,
                        1
                    )

            });

        }


        /*
           Sắp xếp:
           TL TR BR BL
        */

        points =
            orderPoints(points);


        /*
           Kiểm tra kích thước
        */

        const topWidth =
            distance(
                points[0],
                points[1]
            );

        const bottomWidth =
            distance(
                points[3],
                points[2]
            );

        const leftHeight =
            distance(
                points[0],
                points[3]
            );

        const rightHeight =
            distance(
                points[1],
                points[2]
            );


        const width =
            Math.max(
                topWidth,
                bottomWidth
            );


        const height =
            Math.max(
                leftHeight,
                rightHeight
            );


        if (
            width < W * 0.25 ||
            height < H * 0.25
        ) {

            approx.delete();
            contour.delete();

            continue;

        }


        /*
           Tờ giấy không nên quá dài mảnh
        */

        const ratio =
            Math.max(
                width,
                height
            ) /
            Math.min(
                width,
                height
            );


        if (
            ratio > 4.5
        ) {

            approx.delete();
            contour.delete();

            continue;

        }


        /* ---------------------------------------------
           ĐIỂM GÓC
        --------------------------------------------- */

        let angleQuality = 0;


        for (
            let j = 0;
            j < 4;
            j++
        ) {

            const prev =
                points[
                    (j + 3) % 4
                ];

            const current =
                points[j];

            const next =
                points[
                    (j + 1) % 4
                ];


            const angle =
                calculateAngle(
                    prev,
                    current,
                    next
                );


            const difference =
                Math.abs(
                    angle - 90
                );


            angleQuality +=
                Math.max(
                    0,
                    1 -
                    difference / 60
                );

        }


        angleQuality /=
            4;


        /* ---------------------------------------------
           DIỆN TÍCH
        --------------------------------------------- */

        const areaRatio =
            area /
            imageArea;


        const areaScore =
            Math.min(
                1,
                areaRatio / 0.75
            );


        /* ---------------------------------------------
           ĐỘ CÂN ĐỐI
        --------------------------------------------- */

        const widthDifference =
            Math.abs(
                topWidth -
                bottomWidth
            ) /
            Math.max(
                topWidth,
                bottomWidth
            );


        const heightDifference =
            Math.abs(
                leftHeight -
                rightHeight
            ) /
            Math.max(
                leftHeight,
                rightHeight
            );


        const shapeQuality =
            1 -
            Math.min(
                1,
                (
                    widthDifference +
                    heightDifference
                ) / 2
            );


        /* ---------------------------------------------
           SCORE
        --------------------------------------------- */

        let score =
            areaScore * 55 +
            angleQuality * 30 +
            shapeQuality * 15;


        /*
           Ưu tiên vùng nằm trong ảnh,
           tránh bắt mép màn hình.
        */

        const centerX =
            (
                points[0].x +
                points[1].x +
                points[2].x +
                points[3].x
            ) / 4;


        const centerY =
            (
                points[0].y +
                points[1].y +
                points[2].y +
                points[3].y
            ) / 4;


        const centerDistance =
            Math.hypot(
                centerX - W / 2,
                centerY - H / 2
            ) /
            Math.hypot(
                W / 2,
                H / 2
            );


        score +=
            Math.max(
                0,
                10 -
                centerDistance * 10
            );


        /* ---------------------------------------------
           LƯU KẾT QUẢ TỐT NHẤT
        --------------------------------------------- */

        if (
            score > bestScore
        ) {

            bestScore =
                score;

            best =
                points;

        }


        approx.delete();
        contour.delete();

    }


    /* ---------------------------------------------
       CLEANUP
    --------------------------------------------- */

    gray.delete();
    blurred.delete();
    edges.delete();
    kernel.delete();
    contours.delete();
    hierarchy.delete();


    /*
       Không đủ tin cậy → giữ ảnh gốc.
    */

    if (
        !best ||
        bestScore < 45
    ) {

        return null;

    }


    return best;

}


/* =========================================================
   SẮP XẾP 4 GÓC
========================================================= */

function orderPoints(points) {

    const result =
        new Array(4);


    /*
       TL = x+y nhỏ nhất
       BR = x+y lớn nhất
    */

    let minSum =
        Infinity;

    let maxSum =
        -Infinity;


    /*
       TR = x-y lớn nhất
       BL = x-y nhỏ nhất
    */

    let maxDiff =
        -Infinity;

    let minDiff =
        Infinity;


    for (
        const p of points
    ) {

        const sum =
            p.x + p.y;

        const diff =
            p.x - p.y;


        if (
            sum < minSum
        ) {

            minSum = sum;
            result[0] = p;

        }


        if (
            sum > maxSum
        ) {

            maxSum = sum;
            result[2] = p;

        }


        if (
            diff > maxDiff
        ) {

            maxDiff = diff;
            result[1] = p;

        }


        if (
            diff < minDiff
        ) {

            minDiff = diff;
            result[3] = p;

        }

    }


    return result;

}


/* =========================================================
   KHOẢNG CÁCH
========================================================= */

function distance(a, b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


/* =========================================================
   TÍNH GÓC
========================================================= */

function calculateAngle(
    a,
    b,
    c
) {

    const abx =
        a.x - b.x;

    const aby =
        a.y - b.y;

    const cbx =
        c.x - b.x;

    const cby =
        c.y - b.y;


    const dot =
        abx * cbx +
        aby * cby;


    const magnitude1 =
        Math.sqrt(
            abx * abx +
            aby * aby
        );


    const magnitude2 =
        Math.sqrt(
            cbx * cbx +
            cby * cby
        );


    if (
        magnitude1 === 0 ||
        magnitude2 === 0
    ) {

        return 0;

    }


    let cosine =
        dot /
        (
            magnitude1 *
            magnitude2
        );


    cosine =
        Math.max(
            -1,
            Math.min(
                1,
                cosine
            )
        );


    return (
        Math.acos(cosine) *
        180 /
        Math.PI
    );

}


/* =========================================================
   KÉO THẲNG PHỐI CẢNH
========================================================= */

function correctPerspective(
    src,
    points
) {

    const topWidth =
        distance(
            points[0],
            points[1]
        );


    const bottomWidth =
        distance(
            points[3],
            points[2]
        );


    const leftHeight =
        distance(
            points[0],
            points[3]
        );


    const rightHeight =
        distance(
            points[1],
            points[2]
        );


    let width =
        Math.round(
            Math.max(
                topWidth,
                bottomWidth
            )
        );


    let height =
        Math.round(
            Math.max(
                leftHeight,
                rightHeight
            )
        );


    /*
       Giới hạn output.
    */

    const MAX_OUTPUT =
        2000;


    const scale =
        Math.min(
            1,
            MAX_OUTPUT /
            Math.max(
                width,
                height
            )
        );


    width =
        Math.max(
            1,
            Math.round(
                width * scale
            )
        );


    height =
        Math.max(
            1,
            Math.round(
                height * scale
            )
        );


    /*
       4 điểm nguồn
    */

    const sourcePoints =
        cv.matFromArray(
            4,
            1,
            cv.CV_32FC2,
            [

                points[0].x,
                points[0].y,

                points[1].x,
                points[1].y,

                points[2].x,
                points[2].y,

                points[3].x,
                points[3].y

            ]
        );


    /*
       4 điểm đích
    */

    const destinationPoints =
        cv.matFromArray(
            4,
            1,
            cv.CV_32FC2,
            [

                0,
                0,

                width,
                0,

                width,
                height,

                0,
                height

            ]
        );


    /*
       Ma trận phối cảnh
    */

    const transform =
        cv.getPerspectiveTransform(
            sourcePoints,
            destinationPoints
        );


    const corrected =
        new cv.Mat();


    cv.warpPerspective(
        src,
        corrected,
        transform,
        new cv.Size(
            width,
            height
        ),
        cv.INTER_CUBIC,
        cv.BORDER_CONSTANT,
        new cv.Scalar(
            255,
            255,
            255,
            255
        )
    );


    /*
       Tăng nhẹ độ sáng / tương phản.
    */

    const enhanced =
        new cv.Mat();


    cv.convertScaleAbs(
        corrected,
        enhanced,
        1.05,
        3
    );


    sourcePoints.delete();
    destinationPoints.delete();
    transform.delete();
    corrected.delete();


    return enhanced;

}


/* =========================================================
   MAT → JPEG
========================================================= */

function matToDataURL(mat) {

    canvas.width =
        mat.cols;

    canvas.height =
        mat.rows;


    cv.imshow(
        canvas,
        mat
    );


    const data =
        canvas.toDataURL(
            "image/jpeg",
            0.94
        );


    mat.delete();


    return data;

}


/* =========================================================
   HIỂN THỊ CÁC TRANG
========================================================= */

function renderPages() {

    pagesBox.innerHTML = "";


    pages.forEach(
        function(page, index) {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "page";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                page;


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "page-title";


            title.innerText =
                `Trang ${index + 1}`;


            container.appendChild(
                image
            );


            container.appendChild(
                title
            );


            pagesBox.appendChild(
                container
            );

        }
    );

}


/* =========================================================
   TẠO PDF
========================================================= */

async function makePDF() {

    if (
        pages.length === 0
    ) {

        alert(
            "Bạn chưa có trang nào."
        );

        return;

    }


    statusBox.innerText =
        "📑 Đang tạo PDF...";


    const jsPDF =
        window.jspdf.jsPDF;


    const pdf =
        new jsPDF({

            orientation:
                "portrait",

            unit:
                "mm",

            format:
                "a4"

        });


    for (
        let i = 0;
        i < pages.length;
        i++
    ) {

        if (
            i > 0
        ) {

            pdf.addPage();

        }


        const image =
            await loadImageURL(
                pages[i]
            );


        const pageWidth =
            210;

        const pageHeight =
            297;


        const scale =
            Math.min(

                pageWidth /
                image.width,

                pageHeight /
                image.height

            );


        const width =
            image.width *
            scale;


        const height =
            image.height *
            scale;


        const x =
            (
                pageWidth -
                width
            ) / 2;


        const y =
            (
                pageHeight -
                height
            ) / 2;


        pdf.addImage(

            pages[i],

            "JPEG",

            x,
            y,

            width,
            height,

            undefined,

            "FAST"

        );

    }


    pdf.save(
        "DocScan.pdf"
    );


    statusBox.innerText =
        "✅ Đã tạo DocScan.pdf";

}


/* =========================================================
   LOAD DATA URL
========================================================= */

function loadImageURL(url) {

    return new Promise(
        function(resolve, reject) {

            const img =
                new Image();


            img.onload =
                function() {

                    resolve(img);

                };


            img.onerror =
                reject;


            img.src =
                url;

        }
    );

}

</script>

</body>
</html>
