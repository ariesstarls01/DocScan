<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>DocScan</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#111;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  padding:18px 16px 10px;text-align:center;
  font-size:24px;font-weight:700;
}
#status{
  text-align:center;color:#aaa;font-size:14px;
  min-height:22px;padding:4px 15px;
}
.buttons{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:10px;padding:12px;
}
button{
  border:0;border-radius:14px;padding:15px 8px;
  background:#292929;color:white;font-size:16px;
  font-weight:600;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
input{display:none}
#preview{
  width:calc(100% - 24px);
  margin:0 12px 12px;
  border-radius:14px;
  display:block;
  background:#222;
}
#pages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;padding:12px;
}
.thumb{
  position:relative;
  background:#222;border-radius:10px;overflow:hidden;
}
.thumb img{width:100%;display:block}
.thumb span{
  position:absolute;right:5px;top:5px;
  background:#000b;border-radius:10px;
  padding:3px 7px;font-size:12px;
}
#download{
  width:calc(100% - 24px);
  margin:0 12px 20px;
  background:#0a84ff;
}
</style>
</head>

<body>

<header>📄 DocScan</header>

<div id="status">Sẵn sàng</div>

<div class="buttons">
  <button onclick="camera.click()">📷 Chụp</button>
  <button onclick="gallery.click()">🖼️ Thư viện</button>
  <button onclick="makePDF()" id="pdfBtn">📄 PDF</button>
</div>

<input id="camera" type="file" accept="image/*" capture="environment">
<input id="gallery" type="file" accept="image/*">

<img id="preview">

<div id="pages"></div>

<button id="download" style="display:none">⬇️ Tải PDF</button>

<script>

const camera = document.getElementById("camera");
const gallery = document.getElementById("gallery");
const preview = document.getElementById("preview");
const pagesBox = document.getElementById("pages");
const statusBox = document.getElementById("status");
const pdfBtn = document.getElementById("pdfBtn");

let pages = [];
let currentImage = null;

camera.onchange = handleFile;
gallery.onchange = handleFile;

function status(t){
  statusBox.textContent = t;
}

function handleFile(e){

  const file = e.target.files[0];
  if(!file)return;

  status("⏳ Đang nhận diện tài liệu...");

  const reader = new FileReader();

  reader.onload = function(){

    const img = new Image();

    img.onload = function(){

      currentImage = img;

      try{
        const result = scanDocument(img);

        pages.push(result);
        showPage(result);

        status("✅ Đã tự căn tài liệu");
      }catch(err){

        console.error(err);

        pages.push(img.src);
        showPage(img.src);

        status("⚠️ Không tìm thấy đủ 4 góc — giữ ảnh gốc");
      }

      e.target.value="";
    };

    img.src = reader.result;
  };

  reader.readAsDataURL(file);
}


/* =========================
   TÌM TÀI LIỆU TỰ ĐỘNG
========================= */

function scanDocument(img){

  const MAX = 700;

  let scale = Math.min(1,MAX/Math.max(img.width,img.height));

  const w = Math.max(100,Math.round(img.width*scale));
  const h = Math.max(100,Math.round(img.height*scale));

  const c = document.createElement("canvas");
  c.width=w;
  c.height=h;

  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);

  const data=ctx.getImageData(0,0,w,h).data;

  /*
    Tìm vùng sáng lớn.
    Giấy thường sáng hơn mặt bàn/nền.
  */

  let gray=new Uint8Array(w*h);

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){

      const i=(y*w+x)*4;

      gray[y*w+x]=
        0.299*data[i]+
        0.587*data[i+1]+
        0.114*data[i+2];
    }
  }

  /*
    Ngưỡng động:
    lấy độ sáng trung bình rồi tìm vùng sáng hơn nền.
  */

  let sum=0;

  for(let i=0;i<gray.length;i++)
    sum+=gray[i];

  const avg=sum/gray.length;

  let threshold=Math.max(150,avg+25);

  let mask=new Uint8Array(w*h);

  for(let i=0;i<gray.length;i++)
    mask[i]=gray[i]>threshold?1:0;


  /*
    Làm kín các khoảng nhỏ.
  */

  for(let pass=0;pass<2;pass++){

    let next=new Uint8Array(mask);

    for(let y=1;y<h-1;y++){

      for(let x=1;x<w-1;x++){

        const p=y*w+x;

        let n=
          mask[p]+
          mask[p-1]+
          mask[p+1]+
          mask[p-w]+
          mask[p+w];

        if(n>=3)next[p]=1;
      }
    }

    mask=next;
  }


  /*
    Tìm thành phần liên thông lớn nhất.
  */

  const visited=new Uint8Array(w*h);

  let best=null;

  for(let sy=0;sy<h;sy++){

    for(let sx=0;sx<w;sx++){

      const start=sy*w+sx;

      if(!mask[start]||visited[start])continue;

      const queue=[start];
      visited[start]=1;

      let count=0;

      let minX=w,maxX=0,minY=h,maxY=0;

      const points=[];

      while(queue.length){

        const p=queue.pop();

        const x=p%w;
        const y=Math.floor(p/w);

        count++;

        if(x<minX)minX=x;
        if(x>maxX)maxX=x;
        if(y<minY)minY=y;
        if(y>maxY)maxY=y;

        points.push([x,y]);

        const neighbors=[
          p-1,p+1,p-w,p+w
        ];

        for(const q of neighbors){

          if(q<0||q>=w*h||visited[q])continue;

          const qx=q%w;
          const qy=Math.floor(q/w);

          if(Math.abs(qx-x)>1||Math.abs(qy-y)>1)continue;

          if(mask[q]){
            visited[q]=1;
            queue.push(q);
          }
        }

      }

      const bw=maxX-minX+1;
      const bh=maxY-minY+1;

      const area=bw*bh;

      if(
        count>best?.count &&
        area>w*h*0.12 &&
        bw>w*0.25 &&
        bh>h*0.25
      ){

        best={
          count,
          points,
          minX,maxX,minY,maxY
        };
      }
    }
  }


  /*
    Nếu không tìm thấy vùng đủ lớn,
    thử toàn bộ ảnh.
  */

  let corners;

  if(best){

    const pts=best.points;

    let tl=null,tr=null,br=null,bl=null;

    let minSum=Infinity;
    let maxSum=-Infinity;
    let minDiff=Infinity;
    let maxDiff=-Infinity;

    for(const p of pts){

      const x=p[0],y=p[1];

      const sum=x+y;
      const diff=x-y;

      if(sum<minSum){
        minSum=sum;
        tl=p;
      }

      if(sum>maxSum){
        maxSum=sum;
        br=p;
      }

      if(diff<minDiff){
        minDiff=diff;
        tr=p;
      }

      if(diff>maxDiff){
        maxDiff=diff;
        bl=p;
      }
    }

    corners=[tl,tr,br,bl];

  }else{

    corners=[
      [0,0],
      [w,0],
      [w,h],
      [0,h]
    ];
  }


  /*
    Kiểm tra góc có hợp lý không.
  */

  corners=corners.map(p=>[
    Math.max(0,Math.min(w,p[0])),
    Math.max(0,Math.min(h,p[1]))
  ]);

  const area=polygonArea(corners);

  if(area<w*h*0.08){

    corners=[
      [0,0],
      [w,0],
      [w,h],
      [0,h]
    ];
  }


  /*
    Chuyển tọa độ về ảnh gốc.
  */

  corners=corners.map(p=>[
    p[0]/scale,
    p[1]/scale
  ]);


  return perspectiveCrop(
    img,
    corners
  );
}


/* =========================
   TÍNH DIỆN TÍCH
========================= */

function polygonArea(p){

  let a=0;

  for(let i=0;i<p.length;i++){

    const j=(i+1)%p.length;

    a+=p[i][0]*p[j][1]
      -p[j][0]*p[i][1];
  }

  return Math.abs(a/2);
}


/* =========================
   CĂN THẲNG 4 GÓC
========================= */

function perspectiveCrop(img,p){

  const [tl,tr,br,bl]=p;

  const widthTop=dist(tl,tr);
  const widthBottom=dist(bl,br);

  const heightLeft=dist(tl,bl);
  const heightRight=dist(tr,br);

  const outW=Math.min(
    1800,
    Math.max(500,Math.round(
      Math.max(widthTop,widthBottom)
    ))
  );

  const outH=Math.min(
    2400,
    Math.max(500,Math.round(
      Math.max(heightLeft,heightRight)
    ))
  );

  const c=document.createElement("canvas");

  c.width=outW;
  c.height=outH;

  const ctx=c.getContext("2d");

  /*
    Phối cảnh bằng 4 góc.
    Mỗi pixel đầu ra được nội suy
    từ tứ giác ban đầu.
  */

  const src=document.createElement("canvas");

  src.width=img.width;
  src.height=img.height;

  const sctx=src.getContext("2d");
  sctx.drawImage(img,0,0);

  const sd=sctx.getImageData(
    0,0,src.width,src.height
  );

  const od=ctx.createImageData(outW,outH);

  for(let y=0;y<outH;y++){

    const v=y/(outH-1);

    for(let x=0;x<outW;x++){

      const u=x/(outW-1);

      const topX=tl[0]+u*(tr[0]-tl[0]);
      const topY=tl[1]+u*(tr[1]-tl[1]);

      const botX=bl[0]+u*(br[0]-bl[0]);
      const botY=bl[1]+u*(br[1]-bl[1]);

      const sx=topX+v*(botX-topX);
      const sy=topY+v*(botY-topY);

      const ix=Math.max(
        0,
        Math.min(src.width-1,Math.round(sx))
      );

      const iy=Math.max(
        0,
        Math.min(src.height-1,Math.round(sy))
      );

      const si=(iy*src.width+ix)*4;
      const oi=(y*outW+x)*4;

      od.data[oi]=sd.data[si];
      od.data[oi+1]=sd.data[si+1];
      od.data[oi+2]=sd.data[si+2];
      od.data[oi+3]=255;
    }
  }

  ctx.putImageData(od,0,0);

  return c.toDataURL(
    "image/jpeg",
    0.92
  );
}


function dist(a,b){

  return Math.hypot(
    a[0]-b[0],
    a[1]-b[1]
  );
}


/* =========================
   HIỂN THỊ TRANG
========================= */

function showPage(src){

  preview.src=src;

  const box=document.createElement("div");
  box.className="thumb";

  const im=document.createElement("img");
  im.src=src;

  const num=document.createElement("span");
  num.textContent=pages.length;

  box.appendChild(im);
  box.appendChild(num);

  pagesBox.appendChild(box);
}


/* =========================
   TẠO PDF
========================= */

async function makePDF(){

  if(!pages.length){

    alert("Hãy chụp hoặc chọn ảnh trước.");
    return;
  }

  status("⏳ Đang tạo PDF...");
  pdfBtn.disabled=true;

  try{

    if(!window.jspdf){

      await loadJsPDF();
    }

    const {jsPDF}=window.jspdf;

    const pdf=new jsPDF({
      orientation:"p",
      unit:"mm",
      format:"a4"
    });

    for(let i=0;i<pages.length;i++){

      if(i>0)
        pdf.addPage();

      const img=await loadImageURL(
        pages[i]
      );

      const ratio=img.width/img.height;

      let w=190;
      let h=w/ratio;

      if(h>277){

        h=277;
        w=h*ratio;
      }

      pdf.addImage(
        img,
        "JPEG",
        (210-w)/2,
        (297-h)/2,
        w,
        h
      );
    }

    pdf.save(
      "DocScan-"+Date.now()+".pdf"
    );

    status("✅ Đã tạo PDF");

  }catch(err){

    console.error(err);

    status("❌ Không tạo được PDF");

    alert(
      "Không tạo được PDF. Hãy thử lại."
    );

  }finally{

    pdfBtn.disabled=false;
  }
}


function loadJsPDF(){

  return new Promise((resolve,reject)=>{

    const s=document.createElement("script");

    s.src=
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

    s.onload=resolve;
    s.onerror=reject;

    document.head.appendChild(s);
  });
}


function loadImageURL(url){

  return new Promise((resolve,reject)=>{

    const img=new Image();

    img.onload=()=>resolve(img);
    img.onerror=reject;

    img.src=url;
  });
}

</script>

</body>
</html>
