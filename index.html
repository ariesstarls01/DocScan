<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">

<title>DocScan</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:#111;
  color:#fff;
  padding:22px 15px;
  text-align:center;
  font-size:24px;
  font-weight:700;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

.status{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  text-align:center;
  box-shadow:0 3px 15px #0001;
  font-size:17px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:16px;
  padding:18px 10px;
  font-size:18px;
  font-weight:600;
  background:#111;
  color:#fff;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.4;
}

.pdf{
  width:100%;
  margin-top:12px;
  background:#555;
}

input{
  display:none;
}

.page{
  background:#fff;
  border-radius:16px;
  padding:10px;
  margin-top:18px;
  box-shadow:0 3px 15px #0001;
}

.page img{
  width:100%;
  display:block;
  border-radius:10px;
}

.remove{
  width:100%;
  margin-top:8px;
  padding:10px;
  background:#ddd;
  color:#111;
  font-size:14px;
}

.error{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:#fff0f0;
  color:#a00000;
  font-size:13px;
  word-break:break-word;
}
</style>
</head>

<body>

<header>
  📄 DocScan
</header>

<div class="container">

  <div class="status" id="status">
    ⏳ Đang tải bộ nhận diện...
  </div>

  <div class="buttons">

    <button onclick="cameraInput.click()">
      📷 Chụp
    </button>

    <button onclick="galleryInput.click()">
      🖼️ Thư viện
    </button>

  </div>

  <input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment">

  <input
    id="galleryInput"
    type="file"
    accept="image/*"
    multiple>

  <button
    id="pdfButton"
    class="pdf"
    disabled
    onclick="makePDF()">
    📄 Xuất PDF
  </button>

  <div id="error" class="error"></div>

  <div id="pages"></div>

</div>


<script type="module">

/* ==================================================
   BIẾN
================================================== */

let scanDocument = null;
let pages = [];


/* ==================================================
   ELEMENT
================================================== */

const cameraInput =
  document.getElementById("cameraInput");

const galleryInput =
  document.getElementById("galleryInput");

const statusBox =
  document.getElementById("status");

const pdfButton =
  document.getElementById("pdfButton");

const pagesBox =
  document.getElementById("pages");

const errorBox =
  document.getElementById("error");


/* ==================================================
   STATUS
================================================== */

function setStatus(text){
  statusBox.textContent = text;
}


/* ==================================================
   ERROR
================================================== */

function showError(error){

  errorBox.style.display = "block";

  errorBox.textContent =
    "Chi tiết lỗi: " +
    String(
      error?.message || error
    );
}

function hideError(){

  errorBox.style.display = "none";
}


/* ==================================================
   LOAD SCANIC
================================================== */

async function loadScanner(){

  const sources = [

    "https://cdn.jsdelivr.net/npm/scanic@1.6.0/dist/scanic.js",

    "https://unpkg.com/scanic@1.6.0/dist/scanic.js"

  ];

  let lastError = null;

  for(const url of sources){

    try{

      const module =
        await import(url);

      if(
        module &&
        typeof module.scanDocument === "function"
      ){

        scanDocument =
          module.scanDocument;

        setStatus("🟢 Sẵn sàng");

        return;
      }

    }
    catch(error){

      console.error(
        "Scanner load error:",
        url,
        error
      );

      lastError = error;
    }
  }

  throw lastError ||
    new Error(
      "Không tải được Scanic."
    );
}


/* ==================================================
   LOAD IMAGE
================================================== */

function loadImage(file){

  return new Promise(
    (resolve,reject)=>{

      const image =
        new Image();

      const url =
        URL.createObjectURL(file);

      image.onload = ()=>{

        URL.revokeObjectURL(url);

        resolve(image);
      };

      image.onerror = ()=>{

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "Không đọc được ảnh."
          )
        );
      };

      image.src = url;
    }
  );
}


/* ==================================================
   CAMERA
================================================== */

cameraInput.addEventListener(
  "change",
  async function(){

    if(
      this.files &&
      this.files[0]
    ){

      await scanFile(
        this.files[0]
      );
    }

    this.value = "";
  }
);


/* ==================================================
   GALLERY
================================================== */

galleryInput.addEventListener(
  "change",
  async function(){

    if(!this.files) return;

    for(
      const file of this.files
    ){

      await scanFile(file);
    }

    this.value = "";
  }
);


/* ==================================================
   SCAN DOCUMENT
================================================== */

async function scanFile(file){

  hideError();

  if(!scanDocument){

    setStatus(
      "❌ Bộ nhận diện chưa sẵn sàng"
    );

    showError(
      "Scanic chưa tải xong."
    );

    return;
  }

  if(
    !file.type.startsWith("image/")
  ){

    showError(
      "File được chọn không phải ảnh."
    );

    return;
  }

  setStatus(
    "🤖 AI đang tìm 4 góc tài liệu..."
  );

  pdfButton.disabled = true;

  try{

    const image =
      await loadImage(file);


    /* ==========================================
       AI TỰ NHẬN DIỆN 4 GÓC
       ========================================== */

    const result =
      await scanDocument(
        image,
        {
          mode:"extract",
          detector:"ml",

          /*
           * Giảm kích thước xử lý
           * để tăng tốc và giảm dung lượng.
           */
          maxProcessingDimension:1400,

          output:"canvas"
        }
      );


    console.log(
      "DocScan result:",
      result
    );


    if(!result){

      throw new Error(
        "Scanner không trả về kết quả."
      );
    }


    if(!result.success){

      throw new Error(
        "AI không nhận diện được 4 góc tài liệu."
      );
    }


    if(!result.output){

      throw new Error(
        "Không tạo được ảnh sau khi căn."
      );
    }


    /* ==========================================
       CANVAS ĐÃ ĐƯỢC TỰ CĂN
       ========================================== */

    const canvas =
      result.output;


    /*
     * JPEG 0.85:
     * đủ nét cho tài liệu,
     * nhẹ hơn đáng kể so với 0.95.
     */

    const imageData =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );


    pages.push(imageData);


    renderPages();


    setStatus(
      "✅ Đã tự động căn thẳng tài liệu"
    );


    pdfButton.disabled = false;

  }
  catch(error){

    console.error(
      "SCAN ERROR:",
      error
    );

    setStatus(
      "❌ Quét tài liệu thất bại"
    );

    showError(error);
  }
}


/* ==================================================
   HIỂN THỊ TRANG
================================================== */

function renderPages(){

  pagesBox.innerHTML = "";


  pages.forEach(
    (src,index)=>{

      const box =
        document.createElement("div");

      box.className =
        "page";


      const img =
        document.createElement("img");

      img.src = src;


      const remove =
        document.createElement("button");

      remove.className =
        "remove";

      remove.textContent =
        "🗑️ Xóa trang " +
        (index + 1);


      remove.onclick =
        function(){

          pages.splice(
            index,
            1
          );

          renderPages();

          pdfButton.disabled =
            pages.length === 0;
        };


      box.appendChild(img);

      box.appendChild(remove);

      pagesBox.appendChild(box);
    }
  );
}


/* ==================================================
   LOAD JSPDF
================================================== */

function loadPDF(){

  return new Promise(
    (resolve,reject)=>{

      const script =
        document.createElement("script");


      script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";


      script.onload =
        resolve;


      script.onerror =
        function(){

          reject(
            new Error(
              "Không tải được thư viện PDF."
            )
          );
        };


      document.head.appendChild(
        script
      );
    }
  );
}


/* ==================================================
   XUẤT PDF
================================================== */

window.makePDF =
async function(){

  if(!pages.length){

    setStatus(
      "⚠️ Chưa có trang nào"
    );

    return;
  }


  hideError();


  setStatus(
    "📄 Đang tạo PDF..."
  );


  try{

    /*
     * Tải jsPDF nếu chưa có.
     */

    if(!window.jspdf){

      await loadPDF();
    }


    if(
      !window.jspdf ||
      !window.jspdf.jsPDF
    ){

      throw new Error(
        "Không tìm thấy jsPDF."
      );
    }


    const jsPDF =
      window.jspdf.jsPDF;


    let pdf = null;


    /* ==========================================
       THÊM TỪNG TRANG
       ========================================== */

    for(
      let i = 0;
      i < pages.length;
      i++
    ){

      const img =
        new Image();


      await new Promise(
        function(resolve,reject){

          img.onload =
            resolve;

          img.onerror =
            function(){

              reject(
                new Error(
                  "Không đọc được trang " +
                  (i + 1)
                )
              );
            };

          img.src =
            pages[i];
        }
      );


      const width =
        img.naturalWidth;


      const height =
        img.naturalHeight;


      const orientation =
        width > height
          ? "landscape"
          : "portrait";


      /* Trang đầu */

      if(i === 0){

        pdf =
          new jsPDF({

            orientation:
              orientation,

            unit:"px",

            format:[
              width,
              height
            ]
          });

      }

      /* Trang tiếp theo */

      else{

        pdf.addPage(
          [
            width,
            height
          ],
          orientation
        );
      }


      /*
       * Chèn ảnh scan vào PDF.
       */

      pdf.addImage(

        pages[i],

        "JPEG",

        0,

        0,

        width,

        height

      );

    }


    /* ==========================================
       LƯU PDF
       ========================================== */

    const date =
      new Date()
        .toISOString()
        .slice(0,10);


    pdf.save(
      "DocScan-" +
      date +
      ".pdf"
    );


    setStatus(
      "✅ Đã xuất PDF thành công"
    );

  }
  catch(error){

    console.error(
      "PDF ERROR:",
      error
    );

    setStatus(
      "❌ Xuất PDF thất bại"
    );

    showError(error);
  }

};


/* ==================================================
   KHỞI ĐỘNG
================================================== */

loadScanner()
.catch(
  function(error){

    console.error(
      "SCANNER LOAD ERROR:",
      error
    );

    setStatus(
      "❌ Không tải được bộ nhận diện"
    );

    showError(error);
  }
);

</script>

</body>
</html>
