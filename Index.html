<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>DocScan</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
               "Segoe UI",sans-serif;
}

main{
  max-width:600px;
  margin:auto;
  padding:28px 18px 40px;
}

.logo{
  text-align:center;
  font-size:55px;
  margin-top:10px;
}

h1{
  text-align:center;
  font-size:32px;
  margin:8px 0;
}

.sub{
  text-align:center;
  color:#999;
  margin-bottom:28px;
}

button,
label{
  display:block;
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  margin:10px 0;
  font-size:17px;
  font-weight:700;
  text-align:center;
}

.primary{
  background:#fff;
  color:#111;
}

.secondary{
  background:#292929;
  color:#fff;
}

input{
  display:none;
}

#status{
  text-align:center;
  color:#aaa;
  min-height:25px;
  margin:15px 0;
}

#original{
  display:none;
  width:100%;
  border-radius:14px;
  margin-top:15px;
}

.pages{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-top:15px;
}

.thumb{
  width:75px;
  height:95px;
  object-fit:cover;
  border-radius:9px;
  border:2px solid #555;
}

.card{
  background:#1d1d1f;
  border-radius:16px;
  padding:15px;
  margin-top:18px;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

.small{
  color:#888;
  font-size:13px;
  line-height:1.4;
}

</style>
</head>


<body>

<main>

<div class="logo">📷</div>

<h1>DocScan</h1>

<div class="sub">
Tự nhận diện mép giấy → căn thẳng → PDF
</div>


<label class="primary" for="camera">
📷 Scan bằng camera
</label>

<input
  id="camera"
  type="file"
  accept="image/*"
  capture="environment"
>


<label class="secondary" for="gallery">
🖼 Chọn ảnh có sẵn
</label>

<input
  id="gallery"
  type="file"
  accept="image/*"
  multiple
>


<div id="status"></div>

<img id="original">


<div id="pages" class="pages"></div>


<div id="controls"
     class="card"
     style="display:none">

<div class="small">
DocScan sẽ tự tìm tờ giấy trong ảnh và
tự chỉnh méo phối cảnh. Không cần kéo góc.
</div>

<div class="row">

<button
  id="add"
  class="secondary">
＋ Thêm trang
</button>

<button
  id="makePDF"
  class="primary">
📄 Xuất PDF
</button>

</div>

</div>

</main>


<!-- OpenCV -->

<script
src="https://docs.opencv.org/4.x/opencv.js">
</script>


<!-- jsPDF -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<script>

let pagesData=[];


const camera=
document.getElementById("camera");

const gallery=
document.getElementById("gallery");

const original=
document.getElementById("original");

const pages=
document.getElementById("pages");

const status=
document.getElementById("status");

const controls=
document.getElementById("controls");



/* =========================
   ĐỢI OPENCV
========================= */

function waitForOpenCV(){

 return new Promise(resolve=>{

   let count=0;

   function check(){

     if(
       window.cv &&
       cv.Mat &&
       cv.getPerspectiveTransform
     ){

       resolve();

     }
     else if(count<100){

       count++;

       setTimeout(check,100);

     }
     else{

       resolve();

     }

   }

   check();

 });

}



/* =========================
   ĐỌC ẢNH
========================= */

function loadImage(file){

 return new Promise((resolve,reject)=>{

   const url=
     URL.createObjectURL(file);

   const img=
     new Image();

   img.onload=()=>{

     URL.revokeObjectURL(url);

     resolve(img);

   };

   img.onerror=reject;

   img.src=url;

 });

}



/* =========================
   TÍNH KHOẢNG CÁCH
========================= */

function distance(a,b){

 return Math.hypot(
   a.x-b.x,
   a.y-b.y
 );

}



/* =========================
   DIỆN TÍCH
========================= */

function polygonArea(p){

 let area=0;

 for(
   let i=0;
   i<4;
   i++
 ){

   const a=p[i];

   const b=p[(i+1)%4];

   area+=
     a.x*b.y-
     b.x*a.y;

 }

 return Math.abs(area)/2;

}



/* =========================
   SẮP XẾP 4 GÓC

   TL TR BR BL
========================= */

function orderPoints(points){

 let cx=
   points.reduce(
     (s,p)=>s+p.x,
     0
   )/4;

 let cy=
   points.reduce(
     (s,p)=>s+p.y,
     0
   )/4;


 let sorted=[...points].sort(

   (a,b)=>
     Math.atan2(
       a.y-cy,
       a.x-cx
     )
     -
     Math.atan2(
       b.y-cy,
       b.x-cx
     )

 );


 let tl=
   sorted.reduce(
     (a,b)=>
       a.x+a.y <
       b.x+b.y
       ?a:b
   );


 let br=
   sorted.reduce(
     (a,b)=>
       a.x+a.y >
       b.x+b.y
       ?a:b
   );


 let tr=
   sorted.reduce(
     (a,b)=>
       a.x-a.y >
       b.x-b.y
       ?a:b
   );


 let bl=
   sorted.reduce(
     (a,b)=>
       a.x-a.y <
       b.x-b.y
       ?a:b
   );


 return[
   tl,
   tr,
   br,
   bl
 ];

}



/* =========================
   TỰ NHẬN DIỆN TỜ GIẤY
========================= */

function detectDocument(img){

 try{

   if(
     !window.cv ||
     !cv.Mat
   ){

     return null;

   }


   /*
      Giảm kích thước ảnh để
      xử lý nhanh hơn trên iPhone
   */

   const maxSize=1800;

   const scale=Math.min(

     1,

     maxSize/
     Math.max(
       img.naturalWidth,
       img.naturalHeight
     )

   );


   const temp=
     document.createElement("canvas");

   temp.width=
     Math.round(
       img.naturalWidth*scale
     );

   temp.height=
     Math.round(
       img.naturalHeight*scale
     );


   temp
     .getContext("2d")
     .drawImage(
       img,
       0,
       0,
       temp.width,
       temp.height
     );


   let src=
     cv.imread(temp);

   let gray=
     new cv.Mat();

   let blur=
     new cv.Mat();

   let edge=
     new cv.Mat();


   cv.cvtColor(
     src,
     gray,
     cv.COLOR_RGBA2GRAY
   );


   cv.GaussianBlur(
     gray,
     blur,
     new cv.Size(5,5),
     0
   );


   cv.Canny(
     blur,
     edge,
     30,
     120
   );


   /*
      Nối các đoạn viền bị đứt
   */

   let kernel=
     cv.getStructuringElement(
       cv.MORPH_RECT,
       new cv.Size(7,7)
     );


   cv.morphologyEx(
     edge,
     edge,
     cv.MORPH_CLOSE,
     kernel
   );


   let contours=
     new cv.MatVector();

   let hierarchy=
     new cv.Mat();


   cv.findContours(

     edge,
     contours,
     hierarchy,

     cv.RETR_LIST,

     cv.CHAIN_APPROX_SIMPLE

   );


   const imageArea=
     src.rows*src.cols;


   let best=null;

   let bestScore=0;


   for(
     let i=0;
     i<contours.size();
     i++
   ){

     let contour=
       contours.get(i);


     let perimeter=
       cv.arcLength(
         contour,
         true
       );


     let approx=
       new cv.Mat();


     cv.approxPolyDP(

       contour,
       approx,

       0.02*perimeter,

       true

     );


     if(
       approx.rows===4
     ){

       let area=
         Math.abs(
           cv.contourArea(
             approx
           )
         );


       /*
          Bỏ các vùng quá nhỏ
       */

       if(
         area >
         imageArea*0.15
         &&
         area <
         imageArea*0.98
       ){

         let p=[];


         for(
           let j=0;
           j<4;
           j++
         ){

           let q=
             approx.intPtr(
               j,
               0
             );


           p.push({

             x:q[0],
             y:q[1]

           });

         }


         p=
           orderPoints(p);


         let w1=
           distance(
             p[0],
             p[1]
           );

         let w2=
           distance(
             p[3],
             p[2]
           );

         let h1=
           distance(
             p[0],
             p[3]
           );

         let h2=
           distance(
             p[1],
             p[2]
           );


         let w=
           (w1+w2)/2;

         let h=
           (h1+h2)/2;


         /*
            Tỷ lệ hình chữ nhật
         */

         let ratio=
           Math.max(w,h)/
           Math.min(w,h);


         /*
            Bỏ các contour quá dài
         */

         if(
           ratio>=1.1 &&
           ratio<=2.4
         ){

           let rectangularity=
             area/(w*h);


           /*
              Ưu tiên tờ giấy lớn,
              gần hình chữ nhật
           */

           let score=

             (area/imageArea)*4
             +
             rectangularity*3;


           if(
             score>bestScore
           ){

             bestScore=
               score;

             if(best)
               best.delete();

             best=
               approx;

           }
           else{

             approx.delete();

           }

         }
         else{

           approx.delete();

         }

       }
       else{

         approx.delete();

       }

     }
     else{

       approx.delete();

     }


     contour.delete();

   }


   let result=null;


   if(best){

     result=[];


     for(
       let i=0;
       i<4;
       i++
     ){

       let q=
         best.intPtr(
           i,
           0
         );


       result.push({

         x:q[0]/scale,

         y:q[1]/scale

       });

     }


     result=
       orderPoints(result);


     best.delete();

   }


   src.delete();

   gray.delete();

   blur.delete();

   edge.delete();

   kernel.delete();

   contours.delete();

   hierarchy.delete();


   return result;


 }
 catch(error){

   console.log(error);

   return null;

 }

}



/* =========================
   CĂN THẲNG
========================= */

function rectify(img,points){

 const maxSize=2200;


 const scale=Math.min(

   1,

   maxSize/
   Math.max(
     img.naturalWidth,
     img.naturalHeight
   )

 );


 const source=
   document.createElement(
     "canvas"
   );


 source.width=
   Math.round(
     img.naturalWidth*scale
   );

 source.height=
   Math.round(
     img.naturalHeight*scale
   );


 source
   .getContext("2d")
   .drawImage(
     img,
     0,
     0,
     source.width,
     source.height
   );


 points=
   points.map(
     p=>({

       x:p.x*scale,

       y:p.y*scale

     })
   );


 const tl=points[0];

 const tr=points[1];

 const br=points[2];

 const bl=points[3];


 const width=Math.round(

   Math.max(

     distance(tl,tr),

     distance(bl,br)

   )

 );


 const height=Math.round(

   Math.max(

     distance(tl,bl),

     distance(tr,br)

   )

 );


 let src=
   cv.imread(source);

 let dst=
   new cv.Mat();


 let srcPts=
   cv.matFromArray(

     4,
     1,
     cv.CV_32FC2,

     [

       tl.x,tl.y,

       tr.x,tr.y,

       br.x,br.y,

       bl.x,bl.y

     ]

   );


 let dstPts=
   cv.matFromArray(

     4,
     1,
     cv.CV_32FC2,

     [

       0,0,

       width,0,

       width,height,

       0,height

     ]

   );


 let matrix=
   cv.getPerspectiveTransform(
     srcPts,
     dstPts
   );


 cv.warpPerspective(

   src,
   dst,
   matrix,

   new cv.Size(
     width,
     height
   ),

   cv.INTER_LINEAR,

   cv.BORDER_CONSTANT

 );


 let result=
   document.createElement(
     "canvas"
   );


 result.width=
   width;

 result.height=
   height;


 cv.imshow(
   result,
   dst
 );


 let data=
   result.toDataURL(
     "image/jpeg",
     0.92
   );


 src.delete();

 dst.delete();

 srcPts.delete();

 dstPts.delete();

 matrix.delete();


 return data;

}



/* =========================
   GIỮ NGUYÊN ẢNH
========================= */

function keepOriginal(img){

 const canvas=
   document.createElement(
     "canvas"
   );


 const max=2200;


 const scale=Math.min(

   1,

   max/
   Math.max(
     img.naturalWidth,
     img.naturalHeight
   )

 );


 canvas.width=
   Math.round(
     img.naturalWidth*scale
   );


 canvas.height=
   Math.round(
     img.naturalHeight*scale
   );


 canvas
   .getContext("2d")
   .drawImage(
     img,
     0,
     0,
     canvas.width,
     canvas.height
   );


 return canvas.toDataURL(
   "image/jpeg",
   0.92
 );

}



/* =========================
   XỬ LÝ ẢNH
========================= */

async function processFile(file){

 await waitForOpenCV();


 status.textContent=
   "🔍 Đang tự nhận diện mép giấy...";


 const img=
   await loadImage(file);


 original.src=
   URL.createObjectURL(file);

 original.style.display=
   "block";


 const corners=
   detectDocument(img);


 if(corners){

   status.textContent=
     "✓ Đã nhận diện tài liệu — đang căn thẳng";


   return rectify(
     img,
     corners
   );

 }


 status.textContent=
   "⚠ Không tìm thấy mép giấy rõ — giữ nguyên ảnh";


 return keepOriginal(img);

}



/* =========================
   THÊM TRANG
========================= */

async function handleFiles(files){

 for(
   const file of [...files]
 ){

   const data=
     await processFile(file);


   pagesData.push(data);


   const thumb=
     document.createElement(
       "img"
     );


   thumb.className=
     "thumb";


   thumb.src=
     data;


   pages.appendChild(
     thumb
   );

 }


 status.textContent=
   `✓ Đã scan ${pagesData.length} trang`;


 controls.style.display=
   "block";

}



/* CAMERA */

camera.onchange=()=>{

 if(camera.files.length){

   handleFiles(
     camera.files
   );

 }

};



/* GALLERY */

gallery.onchange=()=>{

 if(gallery.files.length){

   handleFiles(
     gallery.files
   );

 }

};



/* THÊM TRANG */

document
.getElementById("add")
.onclick=()=>{

 camera.click();

};



/* =========================
   XUẤT PDF
========================= */

document
.getElementById("makePDF")
.onclick=async()=>{

 if(!pagesData.length){

   return;

 }


 status.textContent=
   "📄 Đang tạo PDF...";


 const {
   jsPDF
 }=
   window.jspdf;


 const pdf=
   new jsPDF({

     orientation:"portrait",

     unit:"mm",

     format:"a4"

   });


 for(
   let i=0;
   i<pagesData.length;
   i++
 ){

   if(i>0){

     pdf.addPage();

   }


   const img=
     await loadImageData(
       pagesData[i]
     );


   const pageW=
     210;

   const pageH=
     297;

   const margin=
     8;


   let w=
     pageW-margin*2;

   let h=
     w*
     img.height/
     img.width;


   if(
     h>
     pageH-margin*2
   ){

     h=
       pageH-margin*2;

     w=
       h*
       img.width/
       img.height;

   }


   const x=
     (pageW-w)/2;


   const y=
     (pageH-h)/2;


   pdf.addImage(

     pagesData[i],

     "JPEG",

     x,
     y,
     w,
     h

   );

 }


 pdf.save(
   "DocScan.pdf"
 );


 status.textContent=
   "✅ Đã tạo DocScan.pdf";

};



/* =========================
   LẤY KÍCH THƯỚC ẢNH
========================= */

function loadImageData(data){

 return new Promise(
   resolve=>{

     const img=
       new Image();


     img.onload=()=>{

       resolve({

         width:
           img.naturalWidth,

         height:
           img.naturalHeight

       });

     };


     img.src=data;

   }
 );

}

</script>

</body>
</html>
